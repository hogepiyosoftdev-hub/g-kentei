<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>G検定 古代の知恵 — BotW Loading Tips</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+JP:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070a0f;
      --bg-panel: rgba(14, 21, 32, 0.78);
      --bg-panel-border: rgba(0, 229, 255, 0.28);
      --sheikah-blue: #00e5ff;
      --sheikah-glow: rgba(0, 229, 255, 0.45);
      --ancient-gold: #e2b755;
      --gold-glow: rgba(226, 183, 85, 0.35);
      --text-main: #e8eff7;
      --text-muted: #8aa0b8;
      --text-dim: #54667a;
      --danger: #ff4757;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Zen Kaku Gothic New', 'Noto Serif JP', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      background-image: 
        radial-gradient(circle at 50% 15%, rgba(0, 229, 255, 0.08) 0%, transparent 60%),
        radial-gradient(circle at 80% 85%, rgba(226, 183, 85, 0.05) 0%, transparent 50%),
        linear-gradient(180deg, #05070a 0%, #0a0f17 100%);
    }

    /* 古代シーカー文様・背景装飾 */
    .bg-runes {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      opacity: 0.18;
      background-size: 80px 80px;
      background-image: 
        linear-gradient(to right, rgba(0, 229, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
      z-index: 0;
    }

    /* コンテナ */
    .app-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px 30px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    /* ヘッダー */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.2);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sheikah-eye {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: var(--sheikah-blue);
      stroke-width: 1.8;
      filter: drop-shadow(0 0 6px var(--sheikah-blue));
    }

    .app-title {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      letter-spacing: 0.18em;
      color: var(--sheikah-blue);
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--sheikah-glow);
    }

    .app-subtitle {
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .filter-select {
      background: rgba(12, 18, 28, 0.85);
      border: 1px solid var(--bg-panel-border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.8rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-select:hover, .filter-select:focus {
      border-color: var(--sheikah-blue);
      box-shadow: 0 0 8px var(--sheikah-glow);
    }

    /* カードエリア */
    .card-stage {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 0;
      perspective: 1000px;
    }

    .tips-card {
      width: 100%;
      background: var(--bg-panel);
      backdrop-filter: blur(14px);
      border: 1px solid var(--bg-panel-border);
      border-radius: 8px;
      padding: 36px 32px;
      position: relative;
      box-shadow: 
        0 15px 35px rgba(0, 0, 0, 0.6),
        inset 0 0 20px rgba(0, 229, 255, 0.04);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s;
      cursor: pointer;
    }

    .tips-card:hover {
      border-color: rgba(0, 229, 255, 0.5);
      box-shadow: 
        0 18px 45px rgba(0, 0, 0, 0.7),
        0 0 20px rgba(0, 229, 255, 0.15),
        inset 0 0 25px rgba(0, 229, 255, 0.08);
    }

    /* カードの四隅のシーカー装飾 */
    .tips-card::before, .tips-card::after {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      border-color: var(--sheikah-blue);
      pointer-events: none;
    }
    .tips-card::before {
      top: -1px; left: -1px;
      border-top: 2px solid var(--sheikah-blue);
      border-left: 2px solid var(--sheikah-blue);
    }
    .tips-card::after {
      bottom: -1px; right: -1px;
      border-bottom: 2px solid var(--sheikah-blue);
      border-right: 2px solid var(--sheikah-blue);
    }

    /* カードヘッダー部 */
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 14px;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 229, 255, 0.1);
      border: 1px solid rgba(0, 229, 255, 0.35);
      color: var(--sheikah-blue);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 4px 12px;
      border-radius: 20px;
      text-shadow: 0 0 6px var(--sheikah-glow);
    }

    .tag-badge {
      font-size: 0.75rem;
      color: var(--ancient-gold);
      background: rgba(226, 183, 85, 0.1);
      border: 1px solid rgba(226, 183, 85, 0.28);
      padding: 3px 10px;
      border-radius: 4px;
      letter-spacing: 0.05em;
    }

    .card-counter {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
    }

    .card-term {
      font-family: 'Noto Serif JP', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 20px;
      line-height: 1.35;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .term-number {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--sheikah-blue);
      opacity: 0.8;
    }

    /* Tips本文（ブレワイ風） */
    .card-body {
      position: relative;
      margin-top: 10px;
    }

    .tip-content {
      font-size: 1.08rem;
      line-height: 1.85;
      color: #dce6f2;
      letter-spacing: 0.04em;
      transition: all 0.3s ease;
    }

    .tip-content.blur-mode {
      filter: blur(8px);
      opacity: 0.35;
      user-select: none;
    }

    .reveal-hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(6, 10, 16, 0.92);
      border: 1px solid var(--sheikah-blue);
      padding: 10px 24px;
      border-radius: 24px;
      color: var(--sheikah-blue);
      font-size: 0.88rem;
      letter-spacing: 0.1em;
      box-shadow: 0 0 15px var(--sheikah-glow);
      pointer-events: none;
      display: none;
    }

    .blur-mode + .reveal-hint {
      display: block;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
    }

    /* アクションバー＆フッター */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .main-nav-bar {
      display: grid;
      grid-template-columns: 1fr 1.6fr 1fr;
      gap: 14px;
    }

    .btn {
      background: rgba(12, 18, 28, 0.88);
      border: 1px solid var(--bg-panel-border);
      color: var(--text-main);
      padding: 14px 20px;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      outline: none;
    }

    .btn:hover {
      border-color: var(--sheikah-blue);
      color: #ffffff;
      box-shadow: 0 0 12px var(--sheikah-glow);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: rgba(0, 229, 255, 0.12);
      border-color: var(--sheikah-blue);
      color: var(--sheikah-blue);
      text-shadow: 0 0 8px var(--sheikah-glow);
    }

    .btn-primary:hover {
      background: rgba(0, 229, 255, 0.22);
    }

    /* 下部ローディング風インジケータ */
    .loading-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem;
      color: var(--text-dim);
    }

    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Cinzel', serif;
      letter-spacing: 0.15em;
      color: var(--sheikah-blue);
    }

    .loading-spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(0, 229, 255, 0.2);
      border-top-color: var(--sheikah-blue);
      border-radius: 50%;
      animation: spin 1.2s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .mode-toggles {
      display: flex;
      gap: 16px;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s;
    }

    .toggle-label:hover {
      color: var(--text-main);
    }

    .toggle-label input {
      accent-color: var(--sheikah-blue);
      cursor: pointer;
    }

    /* キーボードナビゲーションヒント */
    .nav-hints {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.05em;
      margin-top: 6px;
    }

    /* モバイルレスポンシブ */
    @media (max-width: 640px) {
      .tips-card {
        padding: 24px 20px;
      }
      .card-term {
        font-size: 1.3rem;
      }
      .tip-content {
        font-size: 0.98rem;
        line-height: 1.75;
      }
      .main-nav-bar {
        grid-template-columns: 1fr 1fr;
      }
      .btn-random {
        grid-column: span 2;
      }
      .loading-footer {
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="bg-runes"></div>

  <div class="app-container">
    <!-- ヘッダー -->
    <header>
      <div class="title-group">
        <svg class="sheikah-eye" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"></path>
          <line x1="12" y1="5" x2="12" y2="1"></line>
          <line x1="12" y1="23" x2="12" y2="19"></line>
        </svg>
        <div>
          <h1 class="app-title">HYRULE G-TEST TIPS</h1>
          <p class="app-subtitle">G検定 合格の古文書（全536篇）</p>
        </div>
      </div>

      <div class="header-controls">
        <select id="categoryFilter" class="filter-select">
          <option value="ALL">全分野（536問）</option>
        </select>
      </div>
    </header>

    <!-- メインカード -->
    <div class="card-stage" id="cardStage">
      <div class="tips-card" id="tipsCard">
        <div class="card-meta">
          <div style="display: flex; gap: 8px; align-items: center;">
            <span class="category-badge" id="cardCategory">知恵の古文書</span>
            <span class="tag-badge" id="cardTag">分野タグ</span>
          </div>
          <span class="card-counter" id="cardCounter">001 / 536</span>
        </div>

        <div class="card-term">
          <span class="term-number" id="termNumber">#001</span>
          <span id="termText">線形回帰の基本定義</span>
        </div>

        <div class="card-body">
          <p class="tip-content" id="tipText">
            入力変数から直線の式を用いて連続値を予測するモデルだ。
          </p>
          <div class="reveal-hint">TAP TO REVEAL</div>
        </div>
      </div>
    </div>

    <!-- 操作パネル -->
    <div class="controls-panel">
      <div class="main-nav-bar">
        <button class="btn" id="btnPrev">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
          戻る
        </button>
        <button class="btn btn-primary" id="btnNext">
          次へ
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="btn btn-random" id="btnRandom">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
          ランダム
        </button>
      </div>

      <div class="loading-footer">
        <div class="loading-indicator">
          <div class="loading-spinner"></div>
          <span>NOW EXAMINING...</span>
        </div>

        <div class="mode-toggles">
          <label class="toggle-label">
            <input type="checkbox" id="chkFlashcard">
            <span>単語帳モード（1タップ解答 / 2タップ次へ）</span>
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="chkAutoRandom" checked>
            <span>次へを押すとランダム</span>
          </label>
        </div>
      </div>

      <div class="nav-hints">
        [←] 前の問 / [→] 次の問 / [カードタップ] 次へ（単語帳: 1タップ目で解答、2タップ目で次へ）
      </div>
    </div>
  </div>

  <script>
    // 536問のG検定データ
    const CARDS = [{"id": 1, "term": "線形回帰の基本定義", "category": "数理の占い・定義", "tip": "入力変数から直線の式（$y = ax + b$）を用いて連続値を予測する、回帰分析の最も古典的で基本となるモデルだ。", "tag": "機械学習", "full_tip": "【数理の占い・定義：線形回帰の基本定義】入力変数から直線の式（$y = ax + b$）を用いて連続値を予測する、回帰分析の最も古典的で基本となるモデルだ。"}, {"id": 2, "term": "線形回帰の長所と利点", "category": "数理の占い・長所", "tip": "計算が高速で、各特徴量の係数（傾き）を見ればどの変数がどれだけ影響しているか直感的に理解できるぞ。", "tag": "機械学習", "full_tip": "【数理の占い・長所：線形回帰の長所と利点】計算が高速で、各特徴量の係数（傾き）を見ればどの変数がどれだけ影響しているか直感的に理解できるぞ。"}, {"id": 3, "term": "線形回帰の注意点と短所", "category": "数理の占い・注意", "tip": "直線（線形）の関係しか捉えられないため、データがU字型や曲線を描いていると予測精度が著しく落ちる。", "tag": "機械学習", "full_tip": "【数理の占い・注意：線形回帰の注意点と短所】直線（線形）の関係しか捉えられないため、データがU字型や曲線を描いていると予測精度が著しく落ちる。"}, {"id": 4, "term": "線形回帰の数理と背景", "category": "数理の占い・深層", "tip": "係数は予測値と真値の誤差の2乗和を最小にする『最小二乗法』によって解析的に綺麗に求まるのだ。", "tag": "機械学習", "full_tip": "【数理の占い・深層：線形回帰の数理と背景】係数は予測値と真値の誤差の2乗和を最小にする『最小二乗法』によって解析的に綺麗に求まるのだ。"}, {"id": 5, "term": "ロジスティック回帰の基本定義", "category": "確率の天秤・定義", "tip": "線形結合をシグモイド関数に通すことで、あるクラスに属する確率（0〜1）を予測する2値分類の標準機だ。", "tag": "機械学習", "full_tip": "【確率の天秤・定義：ロジスティック回帰の基本定義】線形結合をシグモイド関数に通すことで、あるクラスに属する確率（0〜1）を予測する2値分類の標準機だ。"}, {"id": 6, "term": "ロジスティック回帰の長所と利点", "category": "確率の天秤・長所", "tip": "単なる白黒の判定だけでなく『80%の確率で陽性』といった確信度が分かり、オッズ比による解釈も容易だ。", "tag": "機械学習", "full_tip": "【確率の天秤・長所：ロジスティック回帰の長所と利点】単なる白黒の判定だけでなく『80%の確率で陽性』といった確信度が分かり、オッズ比による解釈も容易だ。"}, {"id": 7, "term": "ロジスティック回帰の注意点と短所", "category": "確率の天秤・注意", "tip": "決定境界は直線（超平面）にしかならないため、複雑に絡み合った非線形な境界は自力では引けないぞ。", "tag": "機械学習", "full_tip": "【確率の天秤・注意：ロジスティック回帰の注意点と短所】決定境界は直線（超平面）にしかならないため、複雑に絡み合った非線形な境界は自力では引けないぞ。"}, {"id": 8, "term": "ロジスティック回帰の数理と背景", "category": "確率の天秤・深層", "tip": "損失関数には二乗誤差ではなく『交差エントロピー誤差（対数損失）』を用い、最尤推定法で最適化する。", "tag": "機械学習", "full_tip": "【確率の天秤・深層：ロジスティック回帰の数理と背景】損失関数には二乗誤差ではなく『交差エントロピー誤差（対数損失）』を用い、最尤推定法で最適化する。"}, {"id": 9, "term": "リッジ回帰（L2正則化）の基本定義", "category": "鎮静の護符・定義", "tip": "線形回帰の損失関数に『重みの2乗和』をペナルティとして加え、パラメータが極端に巨大化するのを防ぐ手法だ。", "tag": "正則化", "full_tip": "【鎮静の護符・定義：リッジ回帰（L2正則化）の基本定義】線形回帰の損 厳格の防衛線・長所：ハードマージンSVMの長所と利点】完全に線形分離可能なデータに対しては、理論上最も美しく完璧な最大マージン境界線を引くことができる。"}, {"id": 27, "term": "ハードマージンSVMの注意点と短所", "category": "厳格の防衛線・注意", "tip": "データにわずか1つでもノイズや外れ値が含まれていたり、線形分離できない場合は解が存在せず破綻する。", "tag": "機械学習", "full_tip": "【厳格の防衛線・注意：ハードマージンSVMの注意点と短所】データにわずか1つでもノイズや外れ値が含まれていたり、線形分離できない場合は解が存在せず破綻する。"}, {"id": 28, "term": "ハードマージンSVMの数理と背景", "category": "厳格の防衛線・深層", "tip": "現実世界のノイズに対応するため、スラック変数を導入した『ソフトマージンSVM』へと発展した。", "tag": "機械学習", "full_tip": "【厳格の防衛線・深層：ハードマージンSVMの数理と背景】現実世界のノイズに対応するため、スラック変数を導入した『ソフトマージンSVM』へと発展した。"}, {"id": 29, "term": "ソフトマージンSVMの基本定義", "category": "寛容の防衛線・定義", "tip": "スラック変数 $\\xi$ を導入し、ある程度の境界線への侵入や誤分類をペナルティ付きで許容する現実的なSVMだ。", "tag": "機械学習", "full_tip": "【寛容の防衛線・定義：ソフトマージンSVMの基本定義】スラック変数 $\\xi$ を導入し、ある程度の境界線への侵入や誤分類をペナルティ付きで許容する現実的なSVMだ。"}, {"id": 30, "term": "ソフトマージンSVMの長所と利点", "category": "寛容の防衛線・長所", "tip": "ノイズや外れ値が混じった現実世界の複雑なデータセットに対しても、破綻することなく安定して境界を引ける。", "tag": "機械学習", "full_tip": "【寛容の防衛線・長所：ソフトマージンSVMの長所と利点】ノイズや外れ値が混じった現実世界の複雑なデータセットに対しても、破綻することなく安定して境界を引ける。"}, {"id": 31, "term": "ソフトマージンSVMの注意点と短所", "category": "寛容の防衛線・注意", "tip": "誤分類へのペナルティの重さを決めるハイパーパラメータ $C$ のチューニングが必要となるぞ。", "tag": "機械学習", "full_tip": "【寛容の防衛線・注意：ソフトマージンSVMの注意点と短所】誤分類へのペナルティの重さを決めるハイパーパラメータ $C$ のチューニングが必要となるぞ。"}, {"id": 32, "term": "ソフトマージンSVMの数理と背景", "category": "寛容の防衛線・深層", "tip": "$C$ を大きくすると誤分類を許さない厳格な境界（過学習寄り）になり、小さくすると寛容な境界になる。", "tag": "機械学習", "full_tip": "【寛容の防衛線・深層：ソフトマージンSVMの数理と背景】$C$ を大きくすると誤分類を許さない厳格な境界（過学習寄り）になり、小さくすると寛容な境界になる。"}, {"id": 33, "term": "カーネルSVM（RBFカーネル）の基本定義", "category": "次元跳躍の術・定義", "tip": "カーネル関数を用いてデータを無限次元の特徴空間へとワープさせ、非線形なデータを分離可能にする神技だ。", "tag": "機械学習", "full_tip": "【次元跳躍の術・定義：カーネルSVM（RBFカーネル）の基本定義】カーネル関数を用いてデータを無限次元の特徴空間へとワープさせ、非線形なデータを分離可能にする神技だ。"}, {"id": 34, "term": "カーネルSVM（RBFカーネル）の長所と利点", "category": "次元跳躍の術・長所", "tip": "低次元では複雑に入り組んで絶対に分けられないデータでも、滑らかで美しい決定境界を引くことができる。", "tag": "機械学習", "full_tip": "【次元跳躍の術・長所：カーネルSVM（RBFカーネル）の長所と利点】低次元では複雑に入り組んで絶対に分けられないデータでも、滑らかで美しい決定境界を引くことができる。"}, {"id": 35, "term": " 背景】データリークを防ぐ『Ordered Boosting』という独自の学習戦略を導入しているのが最大の特徴だ。"}, {"id": 69, "term": "k近傍法（k-NN）の基本定義", "category": "近所の多数決・定義", "tip": "未知のデータが来たとき、空間上で距離が最も近いk個の訓練データを集め、その多数決でクラスを決める手法だ。", "tag": "機械学習", "full_tip": "【近所の多数決・定義：k近傍法（k-NN）の基本定義】未知のデータが来たとき、空間上で距離が最も近いk個の訓練データを集め、その多数決でクラスを決める手法だ。"}, {"id": 70, "term": "k近傍法（k-NN）の長所と利点", "category": "近所の多数決・長所", "tip": "学習フェーズが実質的に存在せず（データを保持するだけ）、直感的でアルゴリズムが極めてシンプルだ。", "tag": "機械学習", "full_tip": "【近所の多数決・長所：k近傍法（k-NN）の長所と利点】学習フェーズが実質的に存在せず（データを保持するだけ）、直感的でアルゴリズムが極めてシンプルだ。"}, {"id": 71, "term": "k近傍法（k-NN）の注意点と短所", "category": "近所の多数決・注意", "tip": "推論時に毎回全訓練データとの距離を計算するため、データ数や次元数が増えると推論が猛烈に遅くなる。", "tag": "機械学習", "full_tip": "【近所の多数決・注意：k近傍法（k-NN）の注意点と短所】推論時に毎回全訓練データとの距離を計算するため、データ数や次元数が増えると推論が猛烈に遅くなる。"}, {"id": 72, "term": "k近傍法（k-NN）の数理と背景", "category": "近所の多数決・深層", "tip": "パラメータkを小さくしすぎるとノイズに敏感で過学習し、大きくしすぎると大雑把で未学習になる。", "tag": "機械学習", "full_tip": "【近所の多数決・深層：k近傍法（k-NN）の数理と背景】パラメータkを小さくしすぎるとノイズに敏感で過学習し、大きくしすぎると大雑把で未学習になる。"}, {"id": 73, "term": "k-meansクラスタリングの基本定義", "category": "集いの広場・定義", "tip": "あらかじめ決めたk個の重心（セントロイド）を配置し、近いデータを取り込んでは重心を更新する非階層型手法だ。", "tag": "クラスタリング", "full_tip": "【集いの広場・定義：k-meansクラスタリングの基本定義】あらかじめ決めたk個の重心（セントロイド）を配置し、近いデータを取り込んでは重心を更新する非階層型手法だ。"}, {"id": 74, "term": "k-meansクラスタリングの長所と利点", "category": "集いの広場・長所", "tip": "アルゴリズムが単純明快で計算が超高速であり、大規模な顧客セグメンテーションなどで大活躍する。", "tag": "クラスタリング", "full_tip": "【集いの広場・長所：k-meansクラスタリングの長所と利点】アルゴリズムが単純明快で計算が超高速であり、大規模な顧客セグメンテーションなどで大活躍する。"}, {"id": 75, "term": "k-meansクラスタリングの注意点と短所", "category": "集いの広場・注意", "tip": "最初に指定するクラスタ数kを人間が決めねばならず、初期値の配置次第で結果が変わり、球状以外の塊は苦手だ。", "tag": "クラスタリング", "full_tip": "【集いの広場・注意：k-meansクラスタリングの注意点と短所】最初に指定するクラスタ数kを人間が決めねばならず、初期値の配置次第で結果が変わり、球状以外の塊は苦手だ。"}, {"id": 76, "term": "k-meansクラスタリングの数理と背景", "category": "集いの広場・深層", "tip": "初期重心の偏りを防ぐ『k-means++』や、最適なkを見極める『エルボー法』と併用するのが賢者の作法だ。", "tag": "クラスタリング", "full_tip": "【集いの広場・深層：k-meansクラスタリングの数理と背景】初期重心の偏りを防ぐ『k-means++』や、最適なkを見極める『エルボー法』と併用するのが賢者の作法だ。"}, {"id": 77, "term": "階層型クラスタリング（ウォード法）の基本定義", "category": "合体の樹形図・定義", "tip": "近いデータ同士を小さなペアから順次合体させていき、樹形図（デンドログラム）を作り上げる手法だ。", "tag": "クラスタリング", "full_tip": "【合体の樹形図・定義：階層型クラスタリング（ウォード法）の基本定義】近いデータ同士を小さなペアから順次合体させていき、樹形図（デンドログラム）を作り上げる手法だ。"}, {"id": 78, "term": "階層型クラスタリング（ウォード法）の長所と利点", "category": "合体の樹形図・長所", "tip": "あらかじめクラスタ数を決める必要がなく、データを俯瞰する階層的なグループ構造を視覚的に把握できる。", "tag": "クラスタリング", "full_tip": "【合体の樹形図・長所：階層型クラスタリング（ウォード法）の長所と利点】あらかじめクラスタ数を決める必要がなく、データを俯瞰する階層的なグループ構造を視覚的に把握できる。"}, {"id": 79, "term": "階層型クラスタリング（ウォード法）の注意点と短所", "category": "合体の樹形図・注意", "tip": "データ数 $N$ に対して計算量が $O(N^3)$、メモリが $O(N^2)$ で増えるため、数万件以上のビッグデータには使えない。", "tag": "クラスタリング", "full_tip": "【合体の樹形図・注意：階層型クラスタリング（ウォード法）の注意点と短所】データ数 $N$ に対して計算量が $O(N^3)$、メモリが $O(N^2)$ で増えるため、数万件以上のビッグデータには使えない。"}, {"id": 80, "term": "階層型クラスタリング（ウォード法）の数理と背景", "category": "合体の樹形図・深層", "tip": "ウォード法は合体時のクラスタ内分散の増加量が最も小さくなるペアを結合するため最も歪みが少ない。", "tag": "クラスタリング", "full_tip": "【合体の樹形図・深層：階層型クラスタリング（ウォード法）の数理と背景】ウォード法は合体時のクラスタ内分散の増加量が最も小さくなるペアを結合するため最も歪みが少ない。"}, {"id": 81, "term": "主成分分析（PCA）の基本定義", "category": "本質の見極め・定義", "tip": "データの散らばり（分散）が最大になる新しい直交軸（主成分）を探し出し、情報を損なわずに次元を要約する手法だ。", "tag": "次元削減", "full_tip": "【本質の見極め・定義：主成分分析（PCA）の基本定義】データの散らばり（分散）が最大になる新しい直交軸（主成分）を探し出し、情報を損なわずに次元を要約する手法だ。"}, {"id": 82, "term": "主成分分析（PCA）の長所と利点", "category": "本質の見極め・長所", "tip": "数十次元の複雑なデータを2〜3次元に圧縮して可視化でき、多重共線性の解消やノイズ低減にも役立つ。", "tag": "次元削減", "full_tip": "【本質の見極め・長所：主成分分析（PCA）の長所と利点】数十次元の複雑なデータを2〜3次元に圧縮して可視化でき、多重共線性の解消やノイズ低減にも役立つ。"}, {"id": 83, "term": "主成分分析（PCA）の注意点と短所", "category": "本質の見極め・注意", "tip": "元々の特徴量が持っていた具体的な意味（『身長』や『年収』）が失われ、合成された抽象的な軸になってしまう。", "tag": "次元削減", "full_tip": "【本質の見極め・注意：主成分分析（PCA）の注意点と短所】元々の特徴量が持っていた具体的な意味（『身長』や『年収』）が失われ、合成された抽象的な軸になってしまう。"}, {"id": 84, "term": "主成分分析（PCA）の数理と背景", "category": "本質の見極め・深層", "tip": "分散共分散行列の『固有値問題』を解くことで求まり、各軸の説明力を示す『寄与率』を累積して評価する。", "tag": "次元削減", "full_tip": "【本質の見極め・深層：主成分分析（PCA）の数理と背景】分散共分散行列の『固有値問題』を解くことで求まり、各軸の説明力を示す『寄与率』を累積して評価する。"}, {"id": 85, "term": "t-SNEの基本定義", "category": "確率の縮図・定義", "tip": "高次元空間でのデータ間の近さをガウス分布の確率で表し、低次元空間でもそれをt分布で保つように射影する可視化技術だ。", "tag": "次元削減", "full_tip": "【確率の縮図・定義：t-SNEの基本定義】高次元空間でのデータ間の近さをガウス分布の確率で表し、低次元空間でもそれをt分布で保つように射影する可視化技術だ。"}, {"id": 86, "term": "t-SNEの長所と利点", "category": "確率の縮図・長所", "tip": "PCAなどの線形手法では絶対に分離できない、複雑にねじれ曲がったクラスタ構造を綺麗に平面上に分離可視化できる。", "tag": "次元削減", "full_tip": "【確率の縮図・長所：t-SNEの長所と利点】PCAなどの線形手法では絶対に分離できない、複雑にねじれ曲がったクラスタ構造を綺麗に平面上に分離可視化できる。"}, {"id": 87, "term": "t-SNEの注意点と短所", "category": "確率の縮図・注意", "tip": "局所的な近傍関係の可視化に特化しているため、遠く離れたクラスタ同士の距離や大きさには意味がない。", "tag": "次元削減", "full_tip": "【確率の縮図・注意：t-SNEの注意点と短所】局所的な近傍関係の可視化に特化しているため、遠く離れたクラスタ同士の距離や大きさには意味がない。"}, {"id": 88, "term": "t-SNEの数理と背景", "category": "確率の縮図・深層", "tip": "perplexity（複雑度）パラメータによって見え方が大きく変わるため、複数の値で試すのが作法だ。", "tag": "次元削減", "full_tip": "【確率の縮図・深層：t-SNEの数理と背景】perplexity（複雑度）パラメータによって見え方が大きく変わるため、複数の値で試すのが作法だ。"}, {"id": 89, "term": "混同行列（Confusion Matrix）の基本定義", "category": "真偽の魔方陣・定義", "tip": "二値分類の結果を真陽性(TP)、偽陽性(FP)、偽陰性(FN)、真陰性(TN)の4つの桝目に整理する魔方陣だ。", "tag": "評価指標", "full_tip": "【真偽の魔方陣・定義：混同行列（Confusion Matrix）の基本定義】二値分類の結果を真陽性(TP)、偽陽性(FP)、偽陰性(FN)、真陰性(TN)の4つの桝目に整理する魔方陣だ。"}, {"id": 90, "term": "混同行列（Confusion Matrix）の長所と利点", "category": "真偽の魔方陣・長所", "tip": "モデルがどの種類の誤り（見逃しなのか、誤検知なのか）を多く犯しているかを詳細に分析できる。", "tag": "評価指標", "full_tip": "【真偽の魔方陣・長所：混同行列（Confusion Matrix）の長所と利点】モデルがどの種類の誤り（見逃しなのか、誤検知なのか）を多く犯しているかを詳細に分析できる。"}, {"id": 91, "term": "混同行列（Confusion Matrix）の注意点と短所", "category": "真偽の魔方陣・注意", "tip": "多クラス分類になると行列が巨大化し、全体的な性能を一目で直感的に比較するのが難しくなる。", "tag": "評価指標", "full_tip": "【真偽の魔方陣・注意：混同行列（Confusion Matrix）の注意点と短所】多クラス分類になると行列が巨大化し、全体的な性能を一目で直感的に比較するのが難しくなる。"}, {"id": 92, "term": "混同行列（Confusion Matrix）の数理と背景", "category": "真偽の魔方陣・深層", "tip": "すべての分類評価指標（Accuracy, Precision, Recall, Specificity, F値）はこの4つの数値から計算される。", "tag": "評価指標", "full_tip": "【真偽の魔方陣・深層：混同行列（Confusion Matrix）の数理と背景】すべての分類評価指標（Accuracy, Precision, Recall, Specificity, F値）はこの4つの数値から計算される。"}, {"id": 93, "term": "正解率（Accuracy）の基本定義", "category": "的中率・定義", "tip": "全データの中で、正しく予測できたサンプルの割合を表す最も直感的な指標だ。$(TP+TN)/\\text{全部}$。", "tag": "評価指標", "full_tip": "【的中率・定義：正解率（Accuracy）の基本定義】全データの中で、正しく予測できたサンプルの割合を表す最も直感的な指標だ。$(TP+TN)/\\text{全部}$。"}, {"id": 94, "term": "正解率（Accuracy）の長所と利点", "category": "的中率・長所", "tip": "計算式が極めてシンプルで、機械学習に詳しくないビジネス担当者にも直感的に説明しやすい。", "tag": "評価指標", "full_tip": "【的中率・長所：正解率（Accuracy）の長所と利点】計算式が極めてシンプルで、機械学習に詳しくないビジネス担当者にも直感的に説明しやすい。"}, {"id": 95, "term": "正解率（Accuracy）の注意点と短所", "category": "的中率・注意", "tip": "陽性が0.1%しかない不均衡データでは、すべて『陰性』と答える無能なモデルでも正解率99.9%が出てしまう。", "tag": "評価指標", "full_tip": "【的中率・注意：正解率（Accuracy）の注意点と短所】陽性が0.1%しかない不均衡データでは、すべて『陰性』と答える無能なモデルでも正解率99.9%が出てしまう。"}, {"id": 96, "term": "正解率（Accuracy）の数理と背景", "category": "的中率・深層", "tip": "データ全体のクラス比率がほぼ半々（50:50）で均衡している場合にのみ信頼できる指標である。", "tag": "評価指標", "full_tip": "【的中率・深層：正解率（Accuracy）の数理と背景】データ全体のクラス比率がほぼ半々（50:50）で均衡している場合にのみ信頼できる指標である。"}, {"id": 97, "term": "適合率（Precision）の基本定義", "category": "必中の構え・定義", "tip": "モデルが『陽性である』と予測したデータの中で、本当に陽性だったサンプルの割合だ。$TP/(TP+FP)$。", "tag": "評価指標", "full_tip": "【必中の構え・定義：適合率（Precision）の基本定義】モデルが『陽性である』と予測したデータの中で、本当に陽性だったサンプルの割合だ。$TP/(TP+FP)$。"}, {"id": 98, "term": "適合率（Precision）の長所と利点", "category": "必中の構え・長所", "tip": "スパムメール判定のように、『無実の正常メールを誤って迷惑メール箱に放り込む（誤検知）』を減らしたい時に輝く。", "tag": "評価指標", "full_tip": "【必中の構え・長所：適合率（Precision）の長所と利点】スパムメール判定のように、『無実の正常メールを誤って迷惑メール箱に放り込む（誤検知）』を減らしたい時に輝く。"}, {"id": 99, "term": "適合率（Precision）の注意点と短所", "category": "必中の構え・注意", "tip": "適合率だけを極限まで高めようとすると、絶対に確実な1件だけを陽性と答えて他を見逃す臆病なモデルになる。", "tag": "評価指標", "full_tip": "【必中の構え・注意：適合率（Precision）の注意点と短所】適合率だけを極限まで高めようとすると、絶対に確実な1件だけを陽性と答えて他を見逃す臆病なモデルになる。"}, {"id": 100, "term": "適合率（Precision）の数理と背景", "category": "必中の構え・深層", "tip": "分類の閾値（カットオフライン）を高く設定すると、適合率は上昇するが再現率は低下するぞ。", "tag": "評価指標", "full_tip": "【必中の構え・深層：適合率（Precision）の数理と背景】分類の閾値（カットオフライン）を高く設定すると、適合率は上昇するが再現率は低下するぞ。"}, {"id": 101, "term": "再現率（Recall / 感度）の基本定義", "category": "漏れなき網・定義", "tip": "実際に陽性である全データの中で、モデルが見逃さずに正しく捉えられたサンプルの割合だ。$TP/(TP+FN)$。", "tag": "評価指標", "full_tip": "【漏れなき網・定義：再現率（Recall / 感度）の基本定義】実際に陽性である全データの中で、モデルが見逃さずに正しく捉えられたサンプルの割合だ。$TP/(TP+FN)$。"}, {"id": 102, "term": "再現率（Recall / 感度）の長所と利点", "category": "漏れなき網・長所", "tip": "がん検診や爆弾探知のように、『見逃し（偽陰性）が人命や重大な損失に直結する』場面で最優先される。", "tag": "評価指標", "full_tip": "【漏れなき網・長所：再現率（Recall / 感度）の長所と利点】がん検診や爆弾探知のように、『見逃し（偽陰性）が人命や重大な損失に直結する』場面で最優先される。"}, {"id": 103, "term": "再現率（Recall / 感度）の注意点と短所", "category": "漏れなき網・注意", "tip": "再現率だけを100%にしようとすると、すべてのデータを手当たり次第に『陽性』と答える粗暴なモデルになる。", "tag": "評価指標", "full_tip": "【漏れなき網・注意：再現率（Recall / 感度）の注意点と短所】再現率だけを100%にしようとすると、すべてのデータを手当たり次第に『陽性』と答える粗暴なモデルになる。"}, {"id": 104, "term": "再現率（Recall / 感度）の数理と背景", "category": "漏れなき網・深層", "tip": "分類の閾値を低く設定すると、見逃しが減って再現率は上がるが、誤検知が増えて適合率は落ちる。", "tag": "評価指標", "full_tip": "【漏れなき網・深層：再現率（Recall / 感度）の数理と背景】分類の閾値を低く設定すると、見逃しが減って再現率は上がるが、誤検知が増えて適合率は落ちる。"}, {"id": 105, "term": "F値（F1-Score）の基本定義", "category": "調和の宝珠・定義", "tip": "適合率（Precision）と再現率（Recall）の『調和平均』をとった総合バランス指標だ。", "tag": "評価指標", "full_tip": "【調和の宝珠・定義：F値（F1-Score）の基本定義】適合率（Precision）と再現率（Recall）の『調和平均』をとった総合バランス指標だ。"}, {"id": 106, "term": "F値（F1-Score）の長所と利点", "category": "調和の宝珠・長所", "tip": "適合率と再現率のトレードオフを綺麗にまとめ、不均衡データでもモデルの真の実力を公平に測れる。", "tag": "評価指標", "full_tip": "【調和の宝珠・長所：F値（F1-Score）の長所と利点】適合率と再現率のトレードオフを綺麗にまとめ、不均衡データでもモデルの真の実力を公平に測れる。"}, {"id": 107, "term": "F値（F1-Score）の注意点と短所", "category": "調和の宝珠・注意", "tip": "適合率と再現率を対等（1対1）に評価するため、どちらか一方を特に重視したいビジネス要件には直結しない。", "tag": "評価指標", "full_tip": "【調和の宝珠・注意：F値（F1-Score）の注意点と短所】適合率と再現率を対等（1対1）に評価するため、どちらか一方を特に重視したいビジネス要件には直結しない。"}, {"id": 108, "term": "F値（F1-Score）の数理と背景", "category": "調和の宝珠・深層", "tip": "調和平均は極端に小さい値に強く引きずられるため、片方だけが100%で片方が0%ならF値は0になる。", "tag": "評価指標", "full_tip": "【調和の宝珠・深層：F値（F1-Score）の数理と背景】調和平均は極端に小さい値に強く引きずられるため、片方だけが100%で片方が0%ならF値は0になる。"}, {"id": 109, "term": "ROC曲線とAUCの基本定義", "category": "軌跡の絵図・定義", "tip": "横軸に偽陽性率（FPR）、縦軸に真陽性率（TPR=Recall）を取り、閾値を変化させたときの軌跡を描く曲線だ。", "tag": "評価指標", "full_tip": "【軌跡の絵図・定義：ROC曲線とAUCの基本定義】横軸に偽陽性率（FPR）、縦軸に真陽性率（TPR=Recall）を取り、閾値を変化させたときの軌跡を描く曲線だ。"}, {"id": 110, "term": "ROC曲線とAUCの長所と利点", "category": "軌跡の絵図・長所", "tip": "分類閾値の選び方に依存せず、モデルそのものが持つ総合的な識別能力をAUC（面積）として定量比較できる。", "tag": "評価指標", "full_tip": "【軌跡の絵図・長所：ROC曲線とAUCの長所と利点】分類閾値の選び方に依存せず、モデルそのものが持つ総合的な識別能力をAUC（面積）として定量比較できる。"}, {"id": 111, "term": "ROC曲線とAUCの注意点と短所", "category": "軌跡の絵図・注意", "tip": "陽性データが全体の0.1%といった極端な不均衡データでは、FPRが小さく抑えられてAUCが高く出すぎる。", "tag": "評価指標", "full_tip": "【軌跡の絵図・注意：ROC曲線とAUCの注意点と短所】陽性データが全体の0.1%といった極端な不均衡データでは、FPRが小さく抑えられてAUCが高く出すぎる。"}, {"id": 112, "term": "ROC曲線とAUCの数理と背景", "category": "軌跡の絵図・深層", "tip": "完全なモデルのAUCは1.0、ランダムなコイントスは0.5となり、左上に大きく膨らむほど優秀なモデルだ。", "tag": "評価指標", "full_tip": "【軌跡の絵図・深層：ROC曲線とAUCの数理と背景】完全なモデルのAUCは1.0、ランダムなコイントスは0.5となり、左上に大きく膨らむほど優秀なモデルだ。"}, {"id": 113, "term": "PR曲線の基本定義", "category": "不均衡の告発・定義", "tip": "横軸に再現率（Recall）、縦軸に適合率（Precision）を取り、閾値を動かしたときの軌跡を描くグラフだ。", "tag": "評価指標", "full_tip": "【不均衡の告発・定義：PR曲線の基本定義】横軸に再現率（Recall）、縦軸に適合率（Precision）を取り、閾値を動かしたときの軌跡を描くグラフだ。"}, {"id": 114, "term": "PR曲線の長所と利点", "category": "不均衡の告発・長所", "tip": "陽性データが極端に少ない不均衡データにおいて、ROC曲線が見逃してしまう精度の粗さを鮮明に暴き出す。", "tag": "評価指標", "full_tip": "【不均衡の告発・長所：PR曲線の長所と利点】陽性データが極端に少ない不均衡データにおいて、ROC曲線が見逃してしまう精度の粗さを鮮明に暴き出す。"}, {"id": 115, "term": "PR曲線の注意点と短所", "category": "不均衡の告発・注意", "tip": "データセット全体の陰性データの比率によって曲線のベースラインが変動するため、異なるデータ間の比較は難しい。", "tag": "評価指標", "full_tip": "【不均衡の告発・注意：PR曲線の注意点と短所】データセット全体の陰性データの比率によって曲線のベースラインが変動するため、異なるデータ間の比較は難しい。"}, {"id": 116, "term": "PR曲線の数理と背景", "category": "不均衡の告発・深層", "tip": "PR曲線の下側面積（PR-AUC）はAverage Precision（AP）とも呼ばれ、物体検出などの標準指標となる。", "tag": "評価指標", "full_tip": "【不均衡の告発・深層：PR曲線の数理と背景】PR曲線の下側面積（PR-AUC）はAverage Precision（AP）とも呼ばれ、物体検出などの標準指標となる。"}, {"id": 117, "term": "ホールドアウト法の基本定義", "category": "単純な分割・定義", "tip": "手持ちのデータを『訓練用』と『テスト用』に例えば7対3の比率で1度だけ分割して評価する手軽な方法だ。", "tag": "モデル検証", "full_tip": "【単純な分割・定義：ホールドアウト法の基本定義】手持ちのデータを『訓練用』と『テスト用』に例えば7対3の比率で1度だけ分割して評価する手軽な方法だ。"}, {"id": 118, "term": "ホールドアウト法の長所と利点", "category": "単純な分割・長所", "tip": "計算コストが最小で済み、大規模なデータセットで短時間にモデルの当たりをつけたい時に重宝する。", "tag": "モデル検証", "full_tip": "【単純な分割・長所：ホールドアウト法の長所と利点】計算コストが最小で済み、大規模なデータセットで短時間にモデルの当たりをつけたい時に重宝する。"}, {"id": 119, "term": "ホールドアウト法の注意点と短所", "category": "単純な分割・注意", "tip": "たまたまテストデータに偏りがあった場合に評価スコアが大きく狂い、データの一部を学習に使えない。", "tag": "モデル検証", "full_tip": "【単純な分割・注意：ホールドアウト法の注意点と短所】たまたまテストデータに偏りがあった場合に評価スコアが大きく狂い、データの一部を学習に使えない。"}, {"id": 120, "term": "ホールドアウト法の数理と背景", "category": "単純な分割・深層", "tip": "データ量が数百万件以上ある巨大データセットであれば、ホールドアウト法でも十分信頼できる。", "tag": "モデル検証", "full_tip": "【単純な分割・深層：ホールドアウト法の数理と背景】データ量が数百万件以上ある巨大データセットであれば、ホールドアウト法でも十分信頼できる。"}, {"id": 121, "term": "k分割交差検証（k-Fold CV）の基本定義", "category": "巡回の儀式・定義", "tip": "データをk個のブロックに分け、1つを検証用、残りを訓練用にしてk回学習と検証を繰り返す念入りな検証法だ。", "tag": "モデル検証", "full_tip": "【巡回の儀式・定義：k分割交差検証（k-Fold CV）の基本定義】データをk個のブロックに分け、1つを検証用、残りを訓練用にしてk回学習と検証を繰り返す念入りな検証法だ。"}, {"id": 122, "term": "k分割交差検証（k-Fold CV）の長所と利点", "category": "巡回の儀式・長所", "tip": "全データが必ず1回ずつ検証に使われるため、データの無駄遣いがなく偏りのない安定した評価が得られる。", "tag": "モデル検証", "full_tip": "【巡回の儀式・長所：k分割交差検証（k-Fold CV）の長所と利点】全データが必ず1回ずつ検証に使われるため、データの無駄遣いがなく偏りのない安定した評価が得られる。"}, {"id": 123, "term": "k分割交差検証（k-Fold CV）の注意点と短所", "category": "巡回の儀式・注意", "tip": "モデルの学習をk回（通常5〜10回）繰り返す必要があるため、計算時間が単純にk倍に跳ね上がる。", "tag": "モデル検証", "full_tip": "【巡回の儀式・注意：k分割交差検証（k-Fold CV）の注意点と短所】モデルの学習をk回（通常5〜10回）繰り返す必要があるため、計算時間が単純にk倍に跳ね上がる。"}, {"id": 124, "term": "k分割交差検証（k-Fold CV）の数理と背景", "category": "巡回の儀式・深層", "tip": "データ数が数千〜数万件程度の中規模データセットにおけるデファクトスタンダードな検証法だ。", "tag": "モデル検証", "full_tip": "【巡回の儀式・深層：k分割交差検証（k-Fold CV）の数理と背景】データ数が数千〜数万件程度の中規模データセットにおけるデファクトスタンダードな検証法だ。"}, {"id": 125, "term": "層化k分割交差検証の基本定義", "category": "均等の配分・定義", "tip": "分類問題において、各分割ブロックに含まれるクラスの比率が元データ全体と等しくなるよう配慮した交差検証だ。", "tag": "モデル検証", "full_tip": "【均等の配分・定義：層化k分割交差検証の基本定義】分類問題において、各分割ブロックに含まれるクラスの比率が元データ全体と等しくなるよう配慮した交差検証だ。"}, {"id": 126, "term": "層化k分割交差検証の長所と利点", "category": "均等の配分・長所", "tip": "陽性が数％しかない不均衡データでも、特定の分割ブロックに陽性が1つも入らない悲劇を確実に防げる。", "tag": "モデル検証", "full_tip": "【均等の配分・長所：層化k分割交差検証の長所と利点】陽性が数％しかない不均衡データでも、特定の分割ブロックに陽性が1つも入らない悲劇を確実に防げる。"}, {"id": 127, "term": "層化k分割交差検証の注意点と短所", "category": "均等の配分・注意", "tip": "回帰問題のように目的変数が連続値である場合にはそのまま適用できない（連続値用の層化手法が必要）。", "tag": "モデル検証", "full_tip": "【均等の配分・注意：層化k分割交差検証の注意点と短所】回帰問題のように目的変数が連続値である場合にはそのまま適用できない（連続値用の層化手法が必要）。"}, {"id": 128, "term": "層化k分割交差検証の数理と背景", "category": "均等の配分・深層", "tip": "分類タスクで交差検証を行う際は、通常のk-Foldではなくこの層化（Stratified）を使うのが鉄則だ。", "tag": "モデル検証", "full_tip": "【均等の配分・深層：層化k分割交差検証の数理と背景】分類タスクで交差検証を行う際は、通常のk-Foldではなくこの層化（Stratified）を使うのが鉄則だ。"}, {"id": 129, "term": "単純パーセプトロンの基本定義", "category": "太古の回路・定義", "tip": "1957年にローゼンブラットが考案した神経モデル。複数の入力に重みを掛けて合算し、閾値を超えたら1を出力する。", "tag": "深層の基礎", "full_tip": "【太古の回路・定義：単純パーセプトロンの基本定義】1957年にローゼンブラットが考案した神経モデル。複数の入力に重みを掛けて合算し、閾値を超えたら1を出力する。"}, {"id": 130, "term": "単純パーセプトロンの長所と利点", "category": "太古の回路・長所", "tip": "人間の脳のシナプス結合の仕組みを数理モデル化し、機械が学習する歴史的第一歩を刻んだ記念碑だ。", "tag": "深層の基礎", "full_tip": "【太古の回路・長所：単純パーセプトロンの長所と利点】人間の脳のシナプス結合の仕組みを数理モデル化し、機械が学習する歴史的第一歩を刻んだ記念碑だ。"}, {"id": 131, "term": "単純パーセプトロンの注意点と短所", "category": "太古の回路・注意", "tip": "1本の直線（超平面）で白黒を分ける『線形分離可能な問題』しか解けず、XOR問題の前で力尽きた。", "tag": "深層の基礎", "full_tip": "【太古の回路・注意：単純パーセプトロンの注意点と短所】1本の直線（超平面）で白黒を分ける『線形分離可能な問題』しか解けず、XOR問題の前で力尽きた。"}, {"id": 132, "term": "単純パーセプトロンの数理と背景", "category": "太古の回路・深層", "tip": "ミンスキーとパパートが著書『パーセプトロン』でその限界を数学的に論証し、第1次冬の時代をもたらした。", "tag": "深層の基礎", "full_tip": "【太古の回路・深層：単純パーセプトロンの数理と背景】ミンスキーとパパートが著書『パーセプトロン』でその限界を数学的に論証し、第1次冬の時代をもたらした。"}, {"id": 133, "term": "多層パーセプトロン（MLP）の基本定義", "category": "重なる階層・定義", "tip": "入力層と出力層の間に1層以上の隠れ層（中間層）を挟み、非線形な活性化関数で繋いだネットワークだ。", "tag": "深層の基礎", "full_tip": "【重なる階層・定義：多層パーセプトロン（MLP）の基本定義】入力層と出力層の間に1層以上の隠れ層（中間層）を挟み、非線形な活性化関数で繋いだネットワークだ。"}, {"id": 134, "term": "多層パーセプトロン（MLP）の長所と利点", "category": "重なる階層・長所", "tip": "隠れ層が空間を歪めることで、単純パーセプトロンでは絶対に解けなかったXOR問題をやすやすと解決した。", "tag": "深層の基礎", "full_tip": "【重なる階層・長所：多層パーセプトロン（MLP）の長所と利点】隠れ層が空間を歪めることで、単純パーセプトロンでは絶対に解けなかったXOR問題をやすやすと解決した。"}, {"id": 135, "term": "多層パーセプトロン（MLP）の注意点と短所", "category": "重なる階層・注意", "tip": "層を深くするとパラメータ数が急増し、勾配消失や過学習が発生してかつては学習が極めて困難だった。", "tag ": 144, "term": "tanh関数（双曲線正接）の数理と背景", "category": "原点対称の波・深層", "tip": "RNNの隠れ状態の更新や、GANの生成器の最終出力層などで現在でも重要な役割を担っている。", "tag": "活性化関数", "full_tip": "【原点対称の波・深層：tanh関数（双曲線正接）の数理と背景】RNNの隠れ状態の更新や、GANの生成器の最終出力層などで現在でも重要な役割を担っている。"}, {"id": 145, "term": "ReLU関数の基本定義", "category": "真直ぐな光・定義", "tip": "入力が0以下なら0、0を超えるならそのまま出力する、現代ディープラーニングの中間層の絶対的標準関数だ。", "tag": "活性化関数", "full_tip": "【真直ぐな光・定義：ReLU関数の基本定義】入力が0以下なら0、0を超えるならそのまま出力する、現代ディープラーニングの中間層の絶対的標準関数だ。"}, {"id": 146, "term": "ReLU関数の長所と利点", "category": "真直ぐな光・長所", "tip": "正の領域での傾きが常に『1』のまま衰えないため、何十層重ねても勾配消失を起こさず超高速に計算できる。", "tag": "活性化関数", "full_tip": "【真直ぐな光・長所：ReLU関数の長所と利点】正の領域での傾きが常に『1』のまま衰えないため、何十層重ねても勾配消失を起こさず超高速に計算できる。"}, {"id": 147, "term": "ReLU関数の注意点と短所", "category": "真直ぐな光・注意", "tip": "入力が負の領域に入り続けると勾配が0のまま更新されなくなり、ニューロンが完全に死滅する（Dying ReLU）ことがある。", "tag": "活性化関数", "full_tip": "【真直ぐな光・注意：ReLU関数の注意点と短所】入力が負の領域に入り続けると勾配が0のまま更新されなくなり、ニューロンが完全に死滅する（Dying ReLU）ことがある。"}, {"id": 148, "term": "ReLU関数の数理と背景", "category": "真直ぐな光・深層", "tip": "派生形として、負の領域にわずかな傾きを残す『Leaky ReLU』や滑らかな曲線の『GELU』が開発された。", "tag": "活性化関数", "full_tip": "【真直ぐな光・深層：ReLU関数の数理と背景】派生形として、負の領域にわずかな傾きを残す『Leaky ReLU』や滑らかな曲線の『GELU』が開発された。"}, {"id": 149, "term": "Leaky ReLUの基本定義", "category": "微かな隙間・定義", "tip": "入力が負の領域でも出力を完全にゼロにせず、$0.01x$ のようにごくわずかな傾きを残す改良型ReLUだ。", "tag": "活性化関数", "full_tip": "【微かな隙間・定義：Leaky ReLUの基本定義】入力が負の領域でも出力を完全にゼロにせず、$0.01x$ のようにごくわずかな傾きを残す改良型ReLUだ。"}, {"id": 150, "term": "Leaky ReLUの長所と利点", "category": "微かな隙間・長所", "tip": "ニューロンに負の入力が続いても微小な勾配が逆伝播し続けるため、Dying ReLUによる細胞死を回避できる。", "tag": "活性化関数", "full_tip": "【微かな隙間・長所：Leaky ReLUの長所と利点】ニューロンに負の入力が続いても微小な勾配が逆伝播し続けるため、Dying ReLUによる細胞死を回避できる。"}, {"id": 151, "term": "Leaky ReLUの注意点と短所", "category": "微かな隙間・注意", "tip": "負の領域の傾き（通常0.01）をハイパーパラメータとして設定する必要があり、劇的な改善にならないこともある。", "tag": "活性化関数", "full_tip": "【微かな隙間・注意：Leaky ReLUの注意点と短所】負の領域の傾き（通常0.01）をハイパーパラメータとして設定する必要があり、劇的な改善にならないこともある。"}, {"id": 152, "term": "Leaky ReLUの数理と背景", "category": "微かな隙間・深層", "tip": "負の傾き $\\alpha$ を固定せず、学習パラメータとして誤差逆伝播で最適化させる『Parametric ReLU（PReLU）』もある。", "tag": "活性化関数", "full_tip": "【微かな隙間・深層：Leaky ReLUの数理と背景】負の傾き $\\alpha$ を固定せず、学習パラメータとして誤差逆伝播で最適化させる『Parametric ReLU（PReLU）』もある。"}, {"id": 153, "term": "GELUの基本定義", "category": "天寵の曲線・定義", "tip": "入力を正規分布の累積確率で確率的に重み付けする、滑らかな非線形カーブを描く近代的な活性化関数だ。", "tag": "活性化関数", "full_tip": "【天寵の曲線・定義：GELUの基本定義】入力を正規分布の累積確率で確率的に重み付けする、滑らかな非線形カーブを描く近代的な活性化関数だ。"}, {"id": 154, "term": "GELUの長所と利点", "category": "天寵の曲線・長所", "tip": "全域で滑らかに微分可能で、わずかに負の領域へ潜り込む絶妙な形状を持ち、Transformer系で最高峰の精度を出す。", "tag": "活性化関数", "full_tip": "【天寵の曲線・長所：GELUの長所と利点】全域で滑らかに微分可能で、わずかに負の領域へ潜り込む絶妙な形状を持ち、Transformer系で最高峰の精度を出す。"}, {"id": 155, "term": "GELUの注意点と短所", "category": "天寵の曲線・注意", "tip": "ReLUに比べて誤差関数や指数関数の計算が含まれるため、わずかに計算コストが高くなる。", "tag": "活性化関数", "full_tip": "【天寵の曲線・注意：GELUの注意点と短所】ReLUに比べて誤差関数や指数関数の計算が含まれるため、わずかに計算コストが高くなる。"}, {"id": 156, "term": "GELUの数理と背景", "category": "天寵の曲線・深層", "tip": "BERT、GPT-2/3/4、ViTなど、現代の基盤モデルの隠れ層の活性化関数としてデファクトスタンダードとなっている。", "tag": "活性化関数", "full_tip": "【天寵の曲線・深層：GELUの数理と背景】BERT、GPT-2/3/4、ViTなど、現代の基盤モデルの隠れ層の活性化関数としてデファクトスタンダードとなっている。"}, {"id": 157, "term": "ソフトマックス関数の基本定義", "category": "全方位の天秤・定義", "tip": "複数の出力値の合計が綺麗に『1.0（100%）』になるように変換する、多クラス分類の出力層の門番だ。", "tag": "活性化関数", "full_tip": "【全方位の天秤・定義：ソフトマックス関数の基本定義】複数の出力値の合計が綺麗に『1.0（100%）』になるように変換する、多クラス分類の出力層の門番だ。"}, {"id": 158, "term": "ソフトマックス関数の長所と利点", "category": "全方位の天秤・長所", "tip": "各クラスである確率（犬である確率70%、猫である確率20%など）を自然に導き出し、直感的に解釈できる。", "tag": "活性化関数", "full_tip": "【全方位の天秤・長所：ソフトマックス関数の長所と利点】各クラスである確率（犬である確率70%、猫である確率20%など）を自然に導き出し、直感的に解釈できる。"}, {"id": 159, "term": "ソフトマックス関数の注意点と短所", "category": "全方位の天秤・注意", "tip": "入力値が極端に巨大になると指数計算（$e^x$）がオーバーフローして計算が破綻する危険がある（最大値を引いて防ぐ）。", "tag": "活性化関数", "full_tip": "【全方位の天秤・注意：ソフトマックス関数の注意点と短所】入力値が極端に巨大になると指数計算（$e^x$）がオーバーフローして計算が破綻する危険がある（最大値を引いて防ぐ）。"}, {"id": 160, "term": "ソフトマックス関数の数理と背景", "category": "全方位の天秤・深層", "tip": "交差エントロピー誤差と組み合わせると、出力層の微分勾配が『予測確率 - 正解ラベル』の単純な引き算になる！", "tag": "活性化関数", "full_tip": "【全方位の天秤・深層：ソフトマックス関数の数理と背景】交差エントロピー誤差 ", "category": "衰える歩調・定義", "tip": "過去の勾配の2乗和をパラメータごとに蓄積し、頻繁に動く重みは歩幅を狭め、あまり動かない重みは大きく動かす手法だ。", "tag": "最適化手法", "full_tip": "【衰える歩調・定義：AdaGradの基本定義】過去の勾配の2乗和をパラメータごとに蓄積し、頻繁に動く重みは歩幅を狭め、あまり動かない重みは大きく動かす手法だ。"}, {"id": 178, "term": "AdaGradの長所と利点", "category": "衰える歩調・長所", "tip": "特徴量ごとに学習率を手動で調整する必要がなく、スパースなデータでも効率的にパラメータを更新できる。", "tag": "最適化手法", "full_tip": "【衰える歩調・長所：AdaGradの長所と利点】特徴量ごとに学習率を手動で調整する必要がなく、スパースなデータでも効率的にパラメータを更新できる。"}, {"id": 179, "term": "AdaGradの注意点と短所", "category": "衰える歩調・注意", "tip": "学習が進むにつれて分母の蓄積値がどんどん巨大化し、最終的に学習率がゼロになって更新が完全に停止してしまう。", "tag": "最適化手法", "full_tip": "【衰える歩調・注意：AdaGradの注意点と短所】学習が進むにつれて分母の蓄積値がどんどん巨大化し、最終的に学習率がゼロになって更新が完全に停止してしまう。"}, {"id": 180, "term": "AdaGradの数理と背景", "category": "衰える歩調・深層", "tip": "この学習率の凍結問題を解決するために、過去の記憶を徐々に薄れさせるRMSpropへと進化した。", "tag": "最適化手法", "full_tip": "【衰える歩調・深層：AdaGradの数理と背景】この学習率の凍結問題を解決するために、過去の記憶を徐々に薄れさせるRMSpropへと進化した。"}, {"id": 181, "term": "RMSpropの基本定義", "category": "持続の呼吸・定義", "tip": "AdaGradの弱点を克服するため、過去の勾配の2乗和を単純加算せず、指数移動平均を使って徐々に忘却させる手法だ。", "tag": "最適化手法", "full_tip": "【持続の呼吸・定義：RMSpropの基本定義】AdaGradの弱点を克服するため、過去の勾配の2乗和を単純加算せず、指数移動平均を使って徐々に忘却させる手法だ。"}, {"id": 182, "term": "RMSpropの長所と利点", "category": "持続の呼吸・長所", "tip": "学習が後半に進んでも学習率が完全にゼロに凍結することがなく、複雑な坂道でも息切れせずに走り続けられる。", "tag": "最適化手法", "full_tip": "【持続の呼吸・長所：RMSpropの長所と利点】学習が後半に進んでも学習率が完全にゼロに凍結することがなく、複雑な坂道でも息切れせずに走り続けられる。"}, {"id": 183, "term": "RMSpropの注意点と短所", "category": "持続の呼吸・注意", "tip": "学習率の初期値の選び方には依然として敏感であり、適切なチューニングが求められる。", "tag": "最適化手法", "full_tip": "【持続の呼吸・注意：RMSpropの注意点と短所】学習率の初期値の選び方には依然として敏感であり、適切なチューニングが求められる。"}, {"id": 184, "term": "RMSpropの数理と背景", "category": "持続の呼吸・深層", "tip": "Hintonがオンライン講義Courseraの中で提案し、論文発表されていないにもかかわらず世界標準となった異色の名機だ。", "tag": "最適化手法", "full_tip": "【持続の呼吸・深層：RMSpropの数理と背景】Hintonがオンライン講義Courseraの中で提案し、論文発表されていないにもかかわらず世界標準となった異色の名機だ。"}, {"id": 185, "term": "Adamの基本定義", "category": "至高の羅針盤・定義", "tip": "過去の勾配の勢いを保つMomentumと、パラメータごとに学習率を自動調整するRMSpropを美しく融合させた手法だ。", "tag": "最適化手法", "full_tip": "【至高の羅針盤・定義：Adamの
