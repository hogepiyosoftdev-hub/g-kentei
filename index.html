ンサンブル学習する効果を生む。"}, {"id": 219, "term": "ドロップアウトの注意点と短所", "category": "間引きの試練・注意", "tip": "学習の進行がやや遅くなり、推論時にはすべてのニューロンを稼働させて出力をドロップアウト率で調整する必要がある。", "tag": "正則化技術", "full_tip": "【間引きの試練・注意：ドロップアウトの注意点と短所】学習の進行がやや遅くなり、推論時にはすべてのニューロンを稼働させて出力をドロップアウト率で調整する必要がある。"}, {"id": 220, "term": "ドロップアウトの数理と背景", "category": "間引きの試練・深層", "tip": "近年では推論時の手作業をなくすため、学習時に出力をあらかじめ拡大しておく『Inverted Dropout』が標準だ。", "tag": "正則化技術", "full_tip": "【間引きの試練・深層：ドロップアウトの数理と背景】近年では推論時の手作業をなくすため、学習時に出力をあらかじめ拡大しておく『Inverted Dropout』が標準だ。"}, {"id": 221, "term": "バッチ正規化（BatchNorm）の基本定義", "category": "整列の号令・定義", "tip": "各層への入力データをミニバッチごとに平均0、分散1に整え、スケールとシフトを施す画期的技術だ。", "tag": "正規化技術", "full_tip": "【整列の号令・定義：バッチ正規化（BatchNorm）の基本定義】各層への入力データをミニバッチごとに平均0、分散1に整え、スケールとシフトを施す画期的技術だ。"}, {"id": 222, "term": "バッチ正規化（BatchNorm）の長所と利点", "category": "整列の号令・長所", "tip": "学習速度が数倍に跳ね上がり、重みの初期値への依存度が劇的に下がり、過学習を抑える副次効果もある。", "tag": "正規化技術", "full_tip": "【整列の号令・長所：バッチ正規化（BatchNorm）の長所と利点】学習速度が数倍に跳ね上がり、重みの初期値への依存度が劇的に下がり、過学習を抑える副次効果もある。"}, {"id": 223, "term": "バッチ正規化（BatchNorm）の注意点と短所", "category": "整列の号令・注意", "tip": "ミニバッチのサイズが極端に小さい（1や2）と平均・分散が狂って性能が落ち、推論時と学習時で挙動が異なる。", "tag": "正規化技術", "full_tip": "【整列の号令・注意：バッチ正規化（BatchNorm）の注意点と短所】ミニバッチのサイズが極端に小さい（1や2）と平均・分散が狂って性能が落ち、推論時と学習時で挙動が異なる。"}, {"id": 224, "term": "バッチ正規化（BatchNorm）の数理と背景", "category": "整列の号令・深層", "tip": "系列データやミニバッチサイズが小さくなりがちなNLPでは、サンプルごとに正規化する『LayerNorm』が好まれる。", "tag": "正規化技術", "full_tip": "【整列の号令・深層：バッチ正規化（BatchNorm）の数理と背景】系列データやミニバッチサイズが小さくなりがちなNLPでは、サンプルごとに正規化する『LayerNorm』が好まれる。"}, {"id": 225, "term": "レイヤー正規化（LayerNorm）の基本定義", "category": "個別の整流・定義", "tip": "バッチ方向ではなく、1つのサンプル内部の全特徴量・全隠れユニットにわたって平均と分散を求めて正規化する技法だ。", "tag": "正規化技術", "full_tip": "【個別の整流・定義：レイヤー正規化（LayerNorm）の基本定義】バッチ方向ではなく、1つのサンプル内部の全特徴量・全隠れユニットにわたって平均と分散を求めて正規化する技法だ。"}, {"id": 226, "term": "レイヤー正規化（LayerNorm）の長所と利点", "category": "個別の整流・長所", "tip": "ミニバッチのサイズに一切依存しないため、バッチサイズが1でも完璧に動作し、系列長の異なるテキストも処理できる。", "tag": "正規化技術", "full_tip": "【個別の整流・長所：レイヤー正規化（LayerNorm）の長所と利点】ミニバッチのサイズに一切依存しないため、バッチサイズが1でも完璧に動作し、系列長の異なるテキストも処理できる。"}, {"id": 227, "term": "レイヤー正規化（LayerNorm）の注意点と短所", "category": "個別の整流・注意", "tip": "画像認識のCNNにおいては、空間構造を無視してチャンネル間で正規化してしまうためバッチ正規化ほど精度が出ない。", "tag": "正規化技術", "full_tip": "【個別の整流・注意：レイヤー正規化（LayerNorm）の注意点と短所】画像認識のCNNにおいては、空間構造を無視してチャンネル間で正規化してしまうためバッチ正規化ほど精度が出ない。"}, {"id": 228, "term": "レイヤー正規化（LayerNorm）の数理と背景", "category": "個別の整流・深層", "tip": "Transformerの各ブロック（Self-AttentionやFFNの前または後）に必ず配置される必須の調律装置だ。", "tag": "正規化技術", "full_tip": "【個別の整流・深層：レイヤー正規化（LayerNorm）の数理と背景】Transformerの各ブロック（Self-AttentionやFFNの前または後）に必ず配置される必須の調律装置だ。"}, {"id": 229, "term": "早期終了（Early Stopping）の基本定義", "category": "潮時の見極め・定義", "tip": "検証データの損失（Validation Loss）が一定エポック数にわたって改善しなくなった瞬間に、学習を強制終了させる技だ。", "tag": "学習の作法", "full_tip": "【潮時の見極め・定義：早期終了（Early Stopping）の基本定義】検証データの損失（Validation Loss）が一定エポック数にわたって改善しなくなった瞬間に、学習を強制終了させる技だ。"}, {"id": 230, "term": "早期終了（Early Stopping）の長所と利点", "category": "潮時の見極め・長所", "tip": "過学習が始まる直前の『最も汎化性能が高い黄金期の重み』を自動で保存でき、無駄な計算時間を大幅に節約できる。", "tag": "学習の作法", "full_tip": "【潮時の見極め・長所：早期終了（Early Stopping）の長所と利点】過学習が始まる直前の『最も汎化性能が高い黄金期の重み』を自動で保存でき、無駄な計算時間を大幅に節約できる。"}, {"id": 231, "term": "早期終了（Early Stopping）の注意点と短所", "category": "潮時の見極め・注意", "tip": "忍耐値（patience）を小さくしすぎると、単なる一時的な学習の停滞（プラトー）を過学習と勘違いして途中で止まってしまう。", "tag": "学習の作法", "full_tip": "【潮時の見極め・注意：早期終了（Early Stopping）の注意点と短所】忍耐値（patience）を小さくしすぎると、単なる一時的な学習の停滞（プラトー）を過学習と勘違いして途中で止まってしまう。"}, {"id": 232, "term": "早期終了（Early Stopping）の数理と背景", "category": "潮時の見極め・深層", "tip": "エポック数をあらかじめ多めに設定しておき、Early Stoppingの安全装置を仕掛けておくのが実務の標準作法だ。", "tag": "学習の作法", "full_tip": "【潮時の見極め・深層：早期終了（Early Stopping）の数理と背景】エポック数をあらかじめ多めに設定しておき、Early Stoppingの安全装置を仕掛けておくのが実務の標準作法だ。"}, {"id": 233, "term": "畳み込み層（Conv層）の基本定義", "category": "写し絵の小窓・定義", "tip": "小さなカーネル（フィルタ）を画像上で滑らせながら積和演算を行い、エッジや模様の特徴マップを取り出す層だ。", "tag": "画像認識CNN", "full_tip": "【写し絵の小窓・定義：畳み込み層（Conv層）の基本定義】小さなカーネル（フィルタ）を画像上で滑らせながら積和演算を行い、エッジや模様の特徴マップを取り出す層だ。"}, {"id": 234, "term": "畳み込み層（Conv層）の長所と利点", "category": "写し絵の小窓・長所", "tip": "全結合層に比べてパラメータ数を劇的に削りながら、画像特有の局所的な空間パターンを余すことなく抽出できる。", "tag": "画像認識CNN", "full_tip": "【写し絵の小窓・長所：畳み込み層（Conv層）の長所と利点】全結合層に比べてパラメータ数を劇的に削りながら、画像特有の局所的な空間パターンを余すことなく抽出できる。"}, {"id": 235, "term": "畳み込み層（Conv層）の注意点と短所", "category": "写し絵の小窓・注意", "tip": "受容野（見える範囲）がカーネルの大きさに縛られるため、画像全体の広範囲な文脈を一発で捉えるのは苦手だ。", "tag": "画像認識CNN", "full_tip": "【写し絵の小窓・注意：畳み込み層（Conv層）の注意点と短所】受容野（見える範囲）がカーネルの大きさに縛られるため、画像全体の広範囲な文脈を一発で捉えるのは苦手だ。"}, {"id": 236, "term": "畳み込み層（Conv層）の数理と背景", "category": "写し絵の小窓・深層", "tip": "出力サイズは $(W - F + 2P)/S + 1$ で計算され、パディング（P）やストライド（S）で大きさを自在に制御する。", "tag": "画像認識CNN", "full_tip": "【写し絵の小窓・深層：畳み込み層（Conv層）の数理と背景】出力サイズは $(W - F + 2P)/S + 1$ で計算され、パディング（P）やストライド（S）で大きさを自在に制御する。"}, {"id": 237, "term": "プーリング層の基本定義", "category": "凝縮の器・定義", "tip": "局所領域の最大値（Max Pooling）や平均値を取り出し、画像の解像度を意図的に圧縮する層だ。", "tag": "画像認識CNN", "full_tip": "【凝縮の器・定義：プーリング層の基本定義】局所領域の最大値（Max Pooling）や平均値を取り出し、画像の解像度を意図的に圧縮する層だ。"}, {"id": 238, "term": "プーリング層の長所と利点", "category": "凝縮の器・長所", "tip": "計算量を大幅に削減し、被写体が数ピクセル上下左右にズレても同じ特徴として認識する『位置不変性』を与える。", "tag": "画像認識CNN", "full_tip": "【凝縮の器・長所：プーリング層の長所と利点】計算量を大幅に削減し、被写体が数ピクセル上下左右にズレても同じ特徴として認識する『位置不変性』を与える。"}, {"id": 239, "term": "プーリング層の注意点と短所", "category": "凝縮の器・注意", "tip": "解像度を強制的に落とすため、画素レベルの精密な位置情報（輪郭のミリ単位の座標など）が失われてしまう。", "tag": "画像認識CNN", "full_tip": "【凝縮の器・注意：プーリング層の注意点と短所】解像度を強制的に落とすため、画素レベルの精密な位置情報（輪郭のミリ単位の座標など）が失われてしまう。"}, {"id": 240, "term": "プーリング層の数理と背景", "category": "凝縮の器・深層", "tip": "近年の高解像度モデルやセグメンテーションでは、プーリングの代わりにストライド畳み込みが好まれる傾向もある。", "tag": "画像認識CNN", "full_tip": "【凝縮の器・深層：プーリング層の数理と背景】近年の高解像度モデルやセグメンテーションでは、プーリングの代わりにストライド畳み込みが好まれる傾向もある。"}, {"id": 241, "term": "ストライドとパディングの基本定義", "category": "歩幅と額縁・定義", "tip": "フィルタを何マスずつ飛ばして動かすかの歩幅がストライド。画像の周囲にダミーの枠を埋めるのがパディングだ。", "tag": "画像認識CNN", "full_tip": "【歩幅と額縁・定義：ストライドとパディングの基本定義】フィルタを何マスずつ飛ばして動かすかの歩幅がストライド。画像の周囲にダミーの枠を埋めるのがパディングだ。"}, {"id": 242, "term": "ストライドとパディングの長所と利点", "category": "歩幅と額縁・長所", "tip": "ストライドを2にすると解像度を半減でき、Sameパディングを使えば畳み込み後も元の解像度を維持できる。", "tag": "画像認識CNN", "full_tip": "【歩幅と額縁・長所：ストライドとパディングの長所と利点】ストライドを2にすると解像度を半減でき、Sameパディングを使えば畳み込み後も元の解像度を維持できる。"}, {"id": 243, "term": "ストライドとパディングの注意点と短所", "category": "歩幅と額縁・注意", "tip": "パディングの数値を誤ると画像の端に不自然なアーティファクト（境界ノイズ）が生じることがある。", "tag": "画像認識CNN", "full_tip": "【歩幅と額縁・注意：ストライドとパディングの注意点と短所】パディングの数値を誤ると画像の端に不自然なアーティファクト（境界ノイズ）が生じることがある。"}, {"id": 244, "term": "ストライドとパディングの数理と背景", "category": "歩幅と額縁・深層", "tip": "試験では『入力サイズ28、フィルタ5、パディング2、ストライド1のとき出力サイズはいくつか？（答：28）』と必ず問われる。", "tag": "画像認識CNN", "full_tip": "【歩幅と額縁・深層：ストライドとパディングの数理と背景】試験では『入力サイズ28、フィルタ5、パディング2、ストライド1のとき出力サイズはいくつか？（答：28）』と必ず問われる。"}, {"id": 245, "term": "1x1畳み込みの基本定義", "category": "次元の圧縮門・定義", "tip": "受容野（縦横）は1ピクセルだけのまま、チャンネル方向（奥行き）の線形結合と次元圧縮を行う特殊な畳み込みだ。", "tag": "画像認識CNN", "full_tip": "【次元の圧縮門・定義：1x1畳み込みの基本定義】受容野（縦横）は1ピクセルだけのまま、チャンネル方向（奥行き）の線形結合と次元圧縮を行う特殊な畳み込みだ。"}, {"id": 246, "term": "1x1畳み込みの長所と利点", "category": "次元の圧縮門・長所", "tip": "空間解像度を損なわずにチャンネル数を自在に増減でき、重い3x3畳み込みの手前に挟むことで計算量を激減させる。", "tag": "画像認識CNN", "full_tip": "【次元の圧縮門・長所：1x1畳み込みの長所と利点】空間解像度を損なわずにチャンネル数を自在に増減でき、重い3x3畳み込みの手前に挟むことで計算量を激減させる。"}, {"id": 247, "term": "1x1畳み込みの注意点と短所", "category": "次元の圧縮門・注意", "tip": "1ピクセルしか見ないため、それ単体では周囲の空間的な模様やエッジを抽出することはできない。", "tag": "画像認識CNN", "full_tip": "【次元の圧縮門・注意：1x1畳み込みの注意点と短所】1ピクセルしか見ないため、それ単体では周囲の空間的な模様やエッジを抽出することはできない。"}, {"id": 248, "term": "1x1畳み込みの数理と背景", "category": "次元の圧縮門・深層", "tip": "GoogLeNetのInceptionモジュールや、ResNetのボトルネック構造の屋台骨として多用される賢者の知恵だ。", "tag": "画像認識CNN", "full_tip": "【次元の圧縮門・深層：1x1畳み込みの数理と背景】GoogLeNetのInceptionモジュールや、ResNetのボトルネック構造の屋台骨として多用される賢者の知恵だ。"}, {"id": 249, "term": "Global Average Pooling（GAP）の基本定義", "category": "大地の集約・定義", "tip": "各特徴マップ全体の平均値を計算し、特徴マップ1枚につき1つの数値へとダイナミックに集約するプーリングだ。", "tag": "画像認識CNN", "full_tip": "【大地の集約・定義：Global Average Pooling（GAP）の基本定義】各特徴マップ全体の平均値を計算し、特徴マップ1枚につき1つの数値へとダイナミックに集約するプーリングだ。"}, {"id": 250, "term": "Global Average Pooling（GAP）の長所と利点", "category": "大地の集約・長所", "tip": "パラメータ数が膨大で過学習の元凶だった最終全結合層を全廃でき、モデルを劇的に軽量化・頑健化する。", "tag": "画像認識CNN", "full_tip": "【大地の集約・長所：Global Average Pooling（GAP）の長所と利点】パラメータ数が膨大で過学習の元凶だった最終全結合層を全廃でき、モデルを劇的に軽量化・頑健化する。"}, {"id": 251, "term": "Global Average Pooling（GAP）の注意点と短所", "category": "大地の集約・注意", "tip": "画像全体の平均をとるため、物体が画像のどこにあったかという詳細な位置情報は完全に失われる。", "tag": "画像認識CNN", "full_tip": "【大地の集約・注意：Global Average Pooling（GAP）の注意点と短所】画像全体の平均をとるため、物体が画像のどこにあったかという詳細な位置情報は完全に失われる。"}, {"id": 252, "term": "Global Average Pooling（GAP）の数理と背景", "category": "大地の集約・深層", "tip": "CAM（Class Activation Mapping）と組み合わせることで、CNNが画像のどこを見て判断したかを可視化できる。", "tag": "画像認識CNN", "full_tip": "【大地の集約・深層：Global Average Pooling（GAP）の数理と背景】CAM（Class Activation Mapping）と組み合わせることで、CNNが画像のどこを見て判断したかを可視化できる。"}, {"id": 253, "term": "データ拡張（Data Augmentation）の基本定義", "category": "千変万化の術・定義", "tip": "手元の画像に対し、反転、回転、切り抜き、色調補正などをランダムに施して人工的に修行データを水増しする技だ。", "tag": "画像技術", "full_tip": "【千変万化の術・定義：データ拡張（Data Augmentation）の基本定義】手元の画像に対し、反転、回転、切り抜き、色調補正などをランダムに施して人工的に修行データを水増しする技だ。"}, {"id": 254, "term": "データ拡張（Data Augmentation）の長所と利点", "category": "千変万化の術・長所", "tip": "データ収集のコストをかけずに過学習を強力に抑え、実環境の多様な撮影条件に対する頑健性を高める。", "tag": "画像技術", "full_tip": "【千変万化の術・長所：データ拡張（Data Augmentation）の長所と利点】データ収集のコストをかけずに過学習を強力に抑え、実環境の多様な撮影条件に対する頑健性を高める。"}, {"id": 255, "term": "データ拡張（Data Augmentation）の注意点と短所", "category": "千変万化の術・注意", "tip": "数字の『6』を180度回転させると『9』になるように、タスクの意味を破壊する不適切な拡張を行うと精度が落ちる。", "tag": "画像技術", "full_tip": "【千変万化の術・注意：データ拡張（Data Augmentation）の注意点と短所】数字の『6』を180度回転させると『9』になるように、タスクの意味を破壊する不適切な拡張を行うと精度が落ちる。"}, {"id": 256, "term": "データ拡張（Data Augmentation）の数理と背景", "category": "千変万化の術・深層", "tip": "2枚の画像を混ぜ合わせる『Mixup』や、一部を四角く切り貼りする『CutMix』などの高度な技法も開発された。", "tag": "画像技術", "full_tip": "【千変万化の術・深層：データ拡張（Data Augmentation）の数理と背景】2枚の画像を混ぜ合わせる『Mixup』や、一部を四角く切り貼りする『CutMix』などの高度な技法も開発された。"}, {"id": 257, "term": "LeNetの基本定義", "category": "太古の祖形・定義", "tip": "1998年にヤン・ルカンが開発した、郵便番号の手書き数字を認識するための現代CNNのすべての原点となる名機だ。", "tag": "CNN歴史", "full_tip": "【太古の祖形・定義：LeNetの基本定義】1998年にヤン・ルカンが開発した、郵便番号の手書き数字を認識するための現代CNNのすべての原点となる名機だ。"}, {"id": 258, "term": "LeNetの長所と利点", "category": "太古の祖形・長所", "tip": "畳み込み層とサブサンプリング（プーリング）層を交互に重ね、最後に全結合層を置くCNNの基本骨格を完成させた。", "tag": "CNN歴史", "full_tip": "【太古の祖形・長所：LeNetの長所と利点】畳み込み層とサブサンプリング（プーリング）層を交互に重ね、最後に全結合層を置くCNNの基本骨格を完成させた。"}, {"id": 259, "term": "LeNetの注意点と短所", "category": "太古の祖形・注意", "tip": "当時の計算力やデータ量の限界から、小さな白黒画像（手書き数字MNISTなど）の処理に用途が限られていた。", "tag": "CNN歴史", "full_tip": "【太古の祖形・注意：LeNetの注意点と短所】当時の計算力やデータ量の限界から、小さな白黒画像（手書き数字MNISTなど）の処理に用途が限られていた。"}, {"id": 260, "term": "LeNetの数理と背景", "category": "太古の祖形・深層", "tip": "活性化関数にはシグモイド関数が使われており、現代のReLUやBatchNormはまだ搭載されていなかった。", "tag": "CNN歴史", "full_tip": "【太古の祖形・深層：LeNetの数理と背景】活性化関数にはシグモイド関数が使われており、現代のReLUやBatchNormはまだ搭載されていなかった。"}, {"id": 261, "term": "AlexNetの基本定義", "category": "革命の咆哮・定義", "tip": "2012年の世界大会ILSVRCで、従来の手法に圧倒的大差をつけて優勝し、第3次AIブームの号砲を鳴らした覇者だ。", "tag": "CNN歴史", "full_tip": "【革命の咆哮・定義：AlexNetの基本定義】2012年の世界大会ILSVRCで、従来の手法に圧倒的大差をつけて優勝し、第3次AIブームの号砲を鳴らした覇者だ。"}, {"id": 262, "term": "AlexNetの長所と利点", "category": "革命の咆哮・長所", "tip": "5層の畳み込み層と3層の全結合層を持ち、活性化関数に『ReLU』、過学習対策に『Dropout』を初導入した。", "tag": "CNN歴史", "full_tip": "【革命の咆哮・長所：AlexNetの長所と利点】5層の畳み込み層と3層の全結合層を持ち、活性化関数に『ReLU』、過学習対策に『Dropout』を初導入した。"}, {"id": 263, "term": "AlexNetの注意点と短所", "category": "革命の咆哮・注意", "tip": "当時の非力なGPU（メモリ3GB）に収めるため、2枚のGPUにネットワークを半分ずつ分割して並列処理させた。", "tag": "CNN歴史", "full_tip": "【革命の咆哮・注意：AlexNetの注意点と短所】当時の非力なGPU（メモリ3GB）に収めるため、2枚のGPUにネットワークを半分ずつ分割して並列処理させた。"}, {"id": 264, "term": "AlexNetの数理と背景", "category": "革命の咆哮・深層", "tip": "トロント大学のヒントン教授の研究室のアレックス・クリジェフスキーらが開発した。", "tag": "CNN歴史", "full_tip": "【革命の咆哮・深層：AlexNetの数理と背景】トロント大学のヒントン教授の研究室のアレックス・クリジェフスキーらが開発した。"}, {"id": 265, "term": "VGGの基本定義", "category": "重厚なる階梯・定義", "tip": "オックスフォード大学のチームが開発した、大きなフィルタを捨て『3x3の極小フィルタ』だけを深く重ねた名機だ。", "tag": "CNN歴史", "full_tip": "【重厚なる階梯・定義：VGGの基本定義】オックスフォード大学のチームが開発した、大きなフィルタを捨て『3x3の極小フィルタ』だけを深く重ねた名機だ。"}, {"id": 266, "term": "VGGの長所と利点", "category": "重厚なる階梯・長所", "tip": "設計思想が極めてシンプルで美しく、後の転移学習や特徴抽出器のベースラインとして長年愛用された。", "tag": "CNN歴史", "full_tip": "【重厚なる階梯・長所：VGGの長所と利点】設計思想が極めてシンプルで美しく、後の転移学習や特徴抽出器のベースラインとして長年愛用された。"}, {"id": 267, "term": "VGGの注意点と短所", "category": "重厚なる階梯・注意", "tip": "後ろの全結合層のパラメータ数が莫大で、モデルのファイル容量が500MB以上と非常に重いのが玉に瑕だ。", "tag": "CNN歴史", "full_tip": "【重厚なる階梯・注意：VGGの注意点と短所】後ろの全結合層のパラメータ数が莫大で、モデルのファイル容量が500MB以上と非常に重いのが玉に瑕だ。"}, {"id": 268, "term": "VGGの数理と背景", "category": "重厚なる階梯・深層", "tip": "層数に応じてVGG16（16層）やVGG19（19層）があり、5x5畳み込み1回より3x3を2回重ねる方が表現力が高いことを示した。", "tag": "CNN歴史", "full_tip": "【重厚なる階梯・深層：VGGの数理と背景】層数に応じてVGG16（16層）やVGG19（19層）があり、5x5畳み込み1回より3x3を2回重ねる方が表現力が高いことを示した。"}, {"id": 269, "term": "GoogLeNetの基本定義", "category": "多頭の神殿・定義", "tip": "異なるサイズ（1x1, 3x3, 5x5）の畳み込みとプーリングを並列に束ねた『Inceptionモジュール』を搭載した知性派だ。", "tag": "CNN歴史", "full_tip": "【多頭の神殿・定義：GoogLeNetの基本定義】異なるサイズ（1x1, 3x3, 5x5）の畳み込みとプーリングを並列に束ねた『Inceptionモジュール』を搭載した知性派だ。"}, {"id": 270, "term": "GoogLeNetの長所と利点", "category": "多頭の神殿・長所", "tip": "1x1畳み込みによる次元圧縮を駆使することで、VGGよりも層数が深い（22層）にもかかわらずパラメータ数は1/10以下だ。", "tag": "CNN歴史", "full_tip": "【多頭の神殿・長所：GoogLeNetの長所と利点】1x1畳み込みによる次元圧縮を駆使することで、VGGよりも層数が深い（22層）にもかかわらずパラメータ数は1/10以下だ。"}, {"id": 271, "term": "GoogLeNetの注意点と短所", "category": "多頭の神殿・注意", "tip": "並列分岐が複雑に入り組んだ構造をしており、実装やハードウェア上での最適化がやや煩雑になる。", "tag": "CNN歴史", "full_tip": "【多頭の神殿・注意：GoogLeNetの注意点と短所】並列分岐が複雑に入り組んだ構造をしており、実装やハードウェア上での最適化がやや煩雑になる。"}, {"id": 272, "term": "GoogLeNetの数理と背景", "category": "多頭の神殿・深層", "tip": "浅い中間層から枝分かれして誤差を逆流させる『補助分類器（Auxiliary Classifier）』で勾配消失をねじ伏せた。", "tag": "CNN歴史", "full_tip": "【多頭の神殿・深層：GoogLeNetの数理と背景】浅い中間層から枝分かれして誤差を逆流させる『補助分類器（Auxiliary Classifier）』で勾配消失をねじ伏せた。"}, {"id": 273, "term": "ResNetの基本定義", "category": "不滅の跳躍・定義", "tip": "入力を出力へとそのままバイパス（ショートカット）させる『スキップ結合』により、152層の超深層を実現した覇者だ。", "tag": "CNN歴史", "full_tip": "【不滅の跳躍・定義：ResNetの基本定義】入力を出力へとそのままバイパス（ショートカット）させる『スキップ結合』により、152層の超深層を実現した覇者だ。"}, {"id": 274, "term": "ResNetの長所と利点", "category": "不滅の跳躍・長所", "tip": "層を何十層・何百層重ねても勾配消失が起きず、層を深くすればするほど性能が素直に向上する革命をもたらした。", "tag": "CNN歴史", "full_tip": "【不滅の跳躍・長所：ResNetの長所と利点】層を何十層・何百層重ねても勾配消失が起きず、層を深くすればするほど性能が素直に向上する革命をもたらした。"}, {"id": 275, "term": "ResNetの注意点と短所", "category": "不滅の跳躍・注意", "tip": "層数が膨大なため学習や推論に強力なGPU計算リソースが必要となり、メモリ消費も増大する。", "tag": "CNN歴史", "full_tip": "【不滅の跳躍・注意：ResNetの注意点と短所】層数が膨大なため学習や推論に強力なGPU計算リソースが必要となり、メモリ消費も増大する。"}, {"id": 276, "term": "ResNetの数理と背景", "category": "不滅の跳躍・深層", "tip": "層の残差 $F(x)$ に入力 $x$ を足して $F(x) + x$ を学習させるため、極論『何もしない（$F(x)=0$）』学習が極めて容易だ。", "tag": "CNN歴史", "full_tip": "【不滅の跳躍・深層：ResNetの数理と背景】層の残差 $F(x)$ に入力 $x$ を足して $F(x) + x$ を学習させるため、極論『何もしない（$F(x)=0$）』学習が極めて容易だ。"}, {"id": 277, "term": "DenseNetの基本定義", "category": "密林の結束・定義", "tip": "ResNetのように足し算するのではなく、前方のすべての層の特徴マップをチャンネル方向に『連結（Concat）』するモデルだ。", "tag": "CNNの深奥", "full_tip": "【密林の結束・定義：DenseNetの基本定義】ResNetのように足し算するのではなく、前方のすべての層の特徴マップをチャンネル方向に『連結（Concat）』するモデルだ。"}, {"id": 278, "term": "DenseNetの長所と利点", "category": "密林の結束・長所", "tip": "浅い層で抽出した低レベルなエッジ情報が失われずに最終層まで直通し、特徴量の再利用効率が極めて高い。", "tag": "CNNの深奥", "full_tip": "【密林の結束・長所：DenseNetの長所と利点】浅い層で抽出した低レベルなエッジ情報が失われずに最終層まで直通し、特徴量の再利用効率が極めて高い。"}, {"id": 279, "term": "DenseNetの注意点と短所", "category": "密林の結束・注意", "tip": "層が進むにつれて特徴マップのチャンネル数が雪だるま式に増加するため、メモリ帯域を激しく消費する。", "tag": "CNNの深奥", "full_tip": "【密林の結束・注意：DenseNetの注意点と短所】層が進むにつれて特徴マップのチャンネル数が雪だるま式に増加するため、メモリ帯域を激しく消費する。"}, {"id": 280, "term": "DenseNetの数理と背景", "category": "密林の結束・深層", "tip": "各層が新しく追加する特徴マップのチャンネル幅を『Growth Rate（成長率）』と呼んで制御する。", "tag": "CNNの深奥", "full_tip": "【密林の結束・深層：DenseNetの数理と背景】各層が新しく追加する特徴マップのチャンネル幅を『Growth Rate（成長率）』と呼んで制御する。"}, {"id": 281, "term": "MobileNetの基本定義", "category": "機動の軽装・定義", "tip": "スマートフォンやドローンなどの端末（エッジデバイス）でリアルタイム動作させるために作られた超軽量CNNだ。", "tag": "軽量化技術", "full_tip": "【機動の軽装・定義：MobileNetの基本定義】スマートフォンやドローンなどの端末（エッジデバイス）でリアルタイム動作させるために作られた超軽量CNNだ。"}, {"id": 282, "term": "MobileNetの長所と利点", "category": "機動の軽装・長所", "tip": "通常の畳み込みを『Depthwise Conv』と『Pointwise Conv』に分離することで、計算量と重みを約1/8〜1/9に削減した。", "tag": "軽量化技術", "full_tip": "【機動の軽装・長所：MobileNetの長所と利点】通常の畳み込みを『Depthwise Conv』と『Pointwise Conv』に分離することで、計算量と重みを約1/8〜1/9に削減した。"}, {"id": 283, "term": "MobileNetの注意点と短所", "category": "機動の軽装・注意", "tip": "モデルを極限まで削ぎ落としているため、ResNetなどの重量級モデルに比べると最高到達精度はわずかに劣る。", "tag": "軽量化技術", "full_tip": "【機動の軽装・注意：MobileNetの注意点と短所】モデルを極限まで削ぎ落としているため、ResNetなどの重量級モデルに比べると最高到達精度はわずかに劣る。"}, {"id": 284, "term": "MobileNetの数理と背景", "category": "機動の軽装・深層", "tip": "V2では逆残差ブロック（Inverted Residuals）を導入し、V3ではNAS（構造自動探索）を取り入れて進化を続けている。", "tag": "軽量化技術", "full_tip": "【機動の軽装・深層：MobileNetの数理と背景】V2では逆残差ブロック（Inverted Residuals）を導入し、V3ではNAS（構造自動探索）を取り入れて進化を続けている。"}, {"id": 285, "term": "EfficientNetの基本定義", "category": "黄金の均整・定義", "tip": "ネットワークの『深さ（層数）』『幅（チャンネル数）』『入力画像解像度』の3つをバランスよく拡大する傑作モデルだ。", "tag": "CNN歴史", "full_tip": "【黄金の均整・定義：EfficientNetの基本定義】ネットワークの『深さ（層数）』『幅（チャンネル数）』『入力画像解像度』の3つをバランスよく拡大する傑作モデルだ。"}, {"id": 286, "term": "EfficientNetの長所と利点", "category": "黄金の均整・長所", "tip": "従来のモデルが手当たり次第に層だけを深くしていたのに対し、数理的な『複合スケーリング』で圧倒的な軽さと高精度を両立した。", "tag": "CNN歴史", "full_tip": "【黄金の均整・長所：EfficientNetの長所と利点】従来のモデルが手当たり次第に層だけを深くしていたのに対し、数理的な『複合スケーリング』で圧倒的な軽さと高精度を両立した。"}, {"id": 287, "term": "EfficientNetの注意点と短所", "category": "黄金の均整・注意", "tip": "高解像度画像を処理する上位モデル（B7など）になると、やはり学習には膨大なGPUリソースが要求される。", "tag": "CNN歴史", "full_tip": "【黄金の均整・注意：EfficientNetの注意点と短所】高解像度画像を処理する上位モデル（B7など）になると、やはり学習には膨大なGPUリソースが要求される。"}, {"id": 288, "term": "EfficientNetの数理と背景", "category": "黄金の均整・深層", "tip": "GoogleのTanとLeによって2019年に発表され、ImageNetの最高精度記録を最小のパラメータ数で塗り替えた。", "tag": "CNN歴史", "full_tip": "【黄金の均整・深層：EfficientNetの数理と背景】GoogleのTanとLeによって2019年に発表され、ImageNetの最高精度記録を最小のパラメータ数で塗り替えた。"}, {"id": 289, "term": "物体検出の評価：IoUとmAPの基本定義", "category": "精度の王冠・定義", "tip": "枠の重なり度合いを測るIoU（Intersection over Union）と、全クラスの平均精度を統合したmAPで競う評価体系だ。", "tag": "画像技術", "full_tip": "【精度の王冠・定義：物体検出の評価：IoUとmAPの基本定義】枠の重なり度合いを測るIoU（Intersection over Union）と、全クラスの平均精度を統合したmAPで競う評価体系だ。"}, {"id": 290, "term": "物体検出の評価：IoUとmAPの長所と利点", "category": "精度の王冠・長所", "tip": "物体が『どこにあるか（位置）』と『何であるか（クラス）』の両方の正確さを、1つの統一スコアで厳密に評価できる。", "tag": "画像技術", "full_tip": "【精度の王冠・長所：物体検出の評価：IoUとmAPの長所と利点】物体が『どこにあるか（位置）』と『何であるか（クラス）』の両方の正確さを、1つの統一スコアで厳密に評価できる。"}, {"id": 291, "term": "物体検出の評価：IoUとmAPの注意点と短所", "category": "精度の王冠・注意", "tip": "IoUの閾値を何に設定するか（0.5なのか、0.75なのか）によって評価スコアが大きく変動する。", "tag": "画像技術", "full_tip": "【精度の王冠・注意：物体検出の評価：IoUとmAPの注意点と短所】IoUの閾値を何に設定するか（0.5なのか、0.75なのか）によって評価スコアが大きく変動する。"}, {"id": 292, "term": "物体検出の評価：IoUとmAPの数理と背景", "category": "精度の王冠・深層", "tip": "COCOコンテストでは、IoU閾値を0.5から0.95まで0.05刻みで変化させた平均値『mAP@[0.5:0.95]』が標準指標となる。", "tag": "画像技術", "full_tip": "【精度の王冠・深層：物体検出の評価：IoUとmAPの数理と背景】COCOコンテストでは、IoU閾値を0.5から0.95まで0.05刻みで変化させた平均値『mAP@[0.5:0.95]』が標準指標となる。"}, {"id": 293, "term": "R-CNNの基本定義", "category": "慎重なる斥候・定義", "tip": "画像からSelective Searchで約2000個の候補領域を切り出し、1つずつCNNとSVMに通して物体を検出する先駆者だ。", "tag": "物体検出", "full_tip": "【慎重なる斥候・定義：R-CNNの基本定義】画像からSelective Searchで約2000個の候補領域を切り出し、1つずつCNNとSVMに通して物体を検出する先駆者だ。"}, {"id": 294, "term": "R-CNNの長所と利点", "category": "慎重なる斥候・長所", "tip": "ディープラーニングを初めて物体検出タスクに本格適用し、従来の古典的手法を圧倒する検出精度を叩き出した。", "tag": "物体検出", "full_tip": "【慎重なる斥候・長所：R-CNNの長所と利点】ディープラーニングを初めて物体検出タスクに本格適用し、従来の古典的手法を圧倒する検出精度を叩き出した。"}, {"id": 295, "term": "R-CNNの注意点と短所", "category": "慎重なる斥候・注意", "tip": "画像1枚に対して2000回もCNNの順伝播を走らせるため、1枚の推論に数十秒もかかる致命的な遅さがあった。", "tag": "物体検出", "full_tip": "【慎重なる斥候・注意：R-CNNの注意点と短所】画像1枚に対して2000回もCNNの順伝播を走らせるため、1枚の推論に数十秒もかかる致命的な遅さがあった。"}, {"id": 296, "term": "R-CNNの数理と背景", "category": "慎重なる斥候・深層", "tip": "この猛烈な遅さを克服するため、Fast R-CNN、そしてFaster R-CNNへと劇的な高速化の進化を遂げていく。", "tag": "物体検出", "full_tip": "【慎重なる斥候・深層：R-CNNの数理と背景】この猛烈な遅さを克服するため、Fast R-CNN、そしてFaster R-CNNへと劇的な高速化の進化を遂げていく。"}, {"id": 297, "term": "Fast R-CNNの基本定義", "category": "疾風の射手・定義", "tip": "画像全体に対してCNNをまず1回だけ適用し、特徴マップの上で候補領域を切り取る（RoI Pooling）俊足のモデルだ。", "tag": "物体検出", "full_tip": "【疾風の射手・定義：Fast R-CNNの基本定義】画像全体に対してCNNをまず1回だけ適用し、特徴マップの上で候補領域を切り取る（RoI Pooling）俊足のモデルだ。"}, {"id": 298, "term": "Fast R-CNNの長所と利点", "category": "疾風の射手・長所", "tip": "R-CNNの最大のボトルネックだった重複計算を解消し、学習速度を約9倍、推論速度を数百倍へと一気に跳ね上げた。", "tag": "物体検出", "full_tip": "【疾風の射手・長所：Fast R-CNNの長所と利点】R-CNNの最大のボトルネックだった重複計算を解消し、学習速度を約9倍、推論速度を数百倍へと一気に跳ね上げた。"}, {"id": 299, "term": "Fast R-CNNの注意点と短所", "category": "疾風の射手・注意", "tip": "候補領域の提案（Region Proposal）自体は依然としてCPU上の外部アルゴリズムに頼っており、そこが限界となった。", "tag": "物体検出", "full_tip": "【疾風の射手・注意：Fast R-CNNの注意点と短所】候補領域の提案（Region Proposal）自体は依然としてCPU上の外部アルゴリズムに頼っており、そこが限界となった。"}, {"id": 300, "term": "Fast R-CNNの数理と背景", "category": "疾風の射手・深層", "tip": "最終的なクラス分類とバウンディングボックスの座標微調整を、マルチタスク損失で同時にエンドツーエンド学習した。", "tag": "物体検出", "full_tip": "【疾風の射手・深層：Fast R-CNNの数理と背景】最終的なクラス分類とバウンディングボックスの座標微調整を、マルチタスク損失で同時にエンドツーエンド学習した。"}, {"id": 301, "term": "Faster R-CNNの基本定義", "category": "完全なる猟犬・定義", "tip": "候補領域の探索までもニューラルネット（RPN: Region Proposal Network）に任せ、全てをGPU上で完結させた名機だ。", "tag": "物体検出", "full_tip": "【完全なる猟犬・定義：Faster R-CNNの基本定義】候補領域の探索までもニューラルネット（RPN: Region Proposal Network）に任せ、全てをGPU上で完結させた名機だ。"}, {"id": 302, "term": "Faster R-CNNの長所と利点", "category": "完全なる猟犬・長所", "tip": "高精度な2段階（Two-stage）検出器の完成形であり、リアルタイムに近いフレームレートでの高精度検出を達成した。", "tag": "物体検出", "full_tip": "【完全なる猟犬・長所：Faster R-CNNの長所と利点】高精度な2段階（Two-stage）検出器の完成形であり、リアルタイムに近いフレームレートでの高精度検出を達成した。"}, {"id": 303, "term": "Faster R-CNNの注意点と短所", "category": "完全なる猟犬・注意", "tip": "1段階（One-stage）のYOLOなどに比べると構造が重厚で、超低遅延が求められるエッジ機器では重いことがある。", "tag": "物体検出", "full_tip": "【完全なる猟犬・注意：Faster R-CNNの注意点と短所】1段階（One-stage）のYOLOなどに比べると構造が重厚で、超低遅延が求められるエッジ機器では重いことがある。"}, {"id": 304, "term": "Faster R-CNNの数理と背景", "category": "完全なる猟犬・深層", "tip": "様々なアスペクト比と大きさを持つ基準枠『アンカーボックス』を導入したことが技術的ハイライトだ。", "tag": "物体検出", "full_tip": "【完全なる猟犬・深層：Faster R-CNNの数理と背景】様々なアスペクト比と大きさを持つ基準枠『アンカーボックス』を導入したことが技術的ハイライトだ。"}, {"id": 305, "term": "YOLO（You Only Look Once）の基本定義", "category": "一閃の太刀・定義", "tip": "画像をグリッドに区切り、候補領域を探すことなく、1発の順伝播で枠の座標とクラス確率を同時に予測する超高速検出器だ。", "tag": "物体検出", "full_tip": "【一閃の太刀・定義：YOLO（You Only Look Once）の基本定義】画像をグリッドに区切り、候補領域を探すことなく、1発の順伝播で枠の座標とクラス確率を同時に予測する超高速検出器だ。"}, {"id": 306, "term": "YOLO（You Only Look Once）の長所と利点", "category": "一閃の太刀・長所", "tip": "毎秒数十〜数百フレームの動画をリアルタイムで監視・処理でき、自動運転や防犯カメラの現場で圧倒的に普及した。", "tag": "物体検出", "full_tip": "【一閃の太刀・長所：YOLO（You Only Look Once）の長所と利点】毎秒数十〜数百フレームの動画をリアルタイムで監視・処理でき、自動運転や防犯カメラの現場で圧倒的に普及した。"}, {"id": 307, "term": "YOLO（You Only Look Once）の注意点と短所", "category": "一閃の太刀・注意", "tip": "初期のバージョンでは、群れをなす小さな物体（密集した小鳥など）の検出精度が2段階検出器に劣る弱点があった。", "tag": "物体検出", "full_tip": "【一閃の太刀・注意：YOLO（You Only Look Once）の注意点と短所】初期のバージョンでは、群れをなす小さな物体（密集した小鳥など）の検出精度が2段階検出器に劣る弱点があった。"}, {"id": 308, "term": "YOLO（You Only Look Once）の数理と背景", "category": "一閃の太刀・深層", "tip": "v1からv8以降に至るまでオープンソースで猛烈な進化を続け、現代では精度と速度の両面で頂点に君臨している。", "tag": "物体検出", "full_tip": "【一閃の太刀・深層：YOLO（You Only Look Once）の数理と背景】v1からv8以降に至るまでオープンソースで猛烈な進化を続け、現代では精度と速度の両面で頂点に君臨している。"}, {"id": 309, "term": "SSD（Single Shot MultiBox Detector）の基本定義", "category": "網羅の網・定義", "tip": "YOLOのように1発で検出しながら、異なる解像度の複数の特徴マップを用いることで大小様々な獲物を捉える名兵装だ。", "tag": "物体検出", "full_tip": "【網羅の網・定義：SSD（Single Shot MultiBox Detector）の基本定義】YOLOのように1発で検出しながら、異なる解像度の複数の特徴マップを用いることで大小様々な獲物を捉える名兵装だ。"}, {"id": 310, "term": "SSD（Single Shot MultiBox Detector）の長所と利点", "category": "網羅の網・長所", "tip": "浅い特徴マップで小さな物体を、深い特徴マップで大きな物体を捉えるため、初期YOLOの弱点だった小物体検出を克服した。", "tag": "物体検出", "full_tip": "【網羅の網・長所：SSD（Single Shot MultiBox Detector）の長所と利点】浅い特徴マップで小さな物体を、深い特徴マップで大きな物体を捉えるため、初期YOLOの弱点だった小物体検出を克服した。"}, {"id": 311, "term": "SSD（Single Shot MultiBox Detector）の注意点と短所", "category": "網羅の網・注意", "tip": "極めて小さな米粒のような物体の検出では、依然として2段階検出器のFaster R-CNNに軍配が上がることがある。", "tag": "物体検出", "full_tip": "【網羅の網・注意：SSD（Single Shot MultiBox Detector）の注意点と短所】極めて小さな米粒のような物体の検出では、依然として2段階検出器のFaster R-CNNに軍配が上がることがある。"}, {"id": 312, "term": "SSD（Single Shot MultiBox Detector）の数理と背景", "category": "網羅の網・深層", "tip": "アンカーボックスの概念を1段階検出器に巧みに融合させ、高速性と高精度のバランスを確立した。", "tag": "物体検出", "full_tip": "【網羅の網・深層：SSD（Single Shot MultiBox Detector）の数理と背景】アンカーボックスの概念を1段階検出器に巧みに融合させ、高速性と高精度のバランスを確立した。"}, {"id": 313, "term": "NMS（Non-Maximum Suppression）の基本定義", "category": "余分なる淘汰・定義", "tip": "同一の物体に対して無数に重複して出力されたバウンディングボックスの中から、本命の1つだけを残して他を間引く後処理だ。", "tag": "物体検出", "full_tip": "【余分なる淘汰・定義：NMS（Non-Maximum Suppression）の基本定義】同一の物体に対して無数に重複して出力されたバウンディングボックスの中から、本命の1つだけを残して他を間引く後処理だ。"}, {"id": 314, "term": "NMS（Non-Maximum Suppression）の長所と利点", "category": "余分なる淘汰・長所", "tip": "画面が重複した枠で埋め尽くされるのを防ぎ、最もスコアが高い信頼できる枠だけをスッキリと抽出できる。", "tag": "物体検出", "full_tip": "【余分なる淘汰・長所：NMS（Non-Maximum Suppression）の長所と利点】画面が重複した枠で埋め尽くされるのを防ぎ、最もスコアが高い信頼できる枠だけをスッキリと抽出できる。"}, {"id": 315, "term": "NMS（Non-Maximum Suppression）の注意点と短所", "category": "余分なる淘汰・注意", "tip": "2つの異なる物体が極端に密集して重なり合っている場合、片方を重複ノイズと勘違いして消してしまうことがある。", "tag": "物体検出", "full_tip": "【余分なる淘汰・注意：NMS（Non-Maximum Suppression）の注意点と短所】2つの異なる物体が極端に密集して重なり合っている場合、片方を重複ノイズと勘違いして消してしまうことがある。"}, {"id": 316, "term": "NMS（Non-Maximum Suppression）の数理と背景", "category": "余分なる淘汰・深層", "tip": "最も確信度が高い枠を選び、それとIoUが一定値（例：0.5）以上重なる枠を芋づる式に削除するループ処理を行う。", "tag": "物体検出", "full_tip": "【余分なる淘汰・深層：NMS（Non-Maximum Suppression）の数理と背景】最も確信度が高い枠を選び、それとIoUが一定値（例：0.5）以上重なる枠を芋づる式に削除するループ処理を行う。"}, {"id": 317, "term": "セマンティックセグメンテーションの基本定義", "category": "画素の透視・定義", "tip": "画像をピクセル単位で塗り分け、どの画素が道路で、どれが車で、どれが空かを完璧に識別する精密な透視術だ。", "tag": "領域分割", "full_tip": "【画素の透視・定義：セマンティックセグメンテーションの基本定義】画像をピクセル単位で塗り分け、どの画素が道路で、どれが車で、どれが空かを完璧に識別する精密な透視術だ。"}, {"id": 318, "term": "セマンティックセグメンテーションの長所と利点", "category": "画素の透視・長所", "tip": "自動運転の走行可能エリア認識や、医療画像診断（腫瘍部位のミリ単位の特定）の根幹技術として不可欠だ。", "tag": "領域分割", "full_tip": "【画素の透視・長所：セマンティックセグメンテーションの長所と利点】自動運転の走行可能エリア認識や、医療画像診断（腫瘍部位のミリ単位の特定）の根幹技術として不可欠だ。"}, {"id": 319, "term": "セマンティックセグメンテーションの注意点と短所", "category": "画素の透視・注意", "tip": "ピクセルごとにクラスを当てるだけなので、同じクラスの個体同士（車Aと車Bの重なり）を区別することはできない。", "tag": "領域分割", "full_tip": "【画素の透視・注意：セマンティックセグメンテーションの注意点と短所】ピクセルごとにクラスを当てるだけなので、同じクラスの個体同士（車Aと車Bの重なり）を区別することはできない。"}, {"id": 320, "term": "セマンティックセグメンテーションの数理と背景", "category": "画素の透視・深層", "tip": "同じクラスの個体まで個別に区別して塗り分ける技術は『インスタンスセグメンテーション』と呼ばれる。", "tag": "領域分割", "full_tip": "【画素の透視・深層：セマンティックセグメンテーションの数理と背景】同じクラスの個体まで個別に区別して塗り分ける技術は『インスタンスセグメンテーション』と呼ばれる。"}, {"id": 321, "term": "FCN（Fully Convolutional Network）の基本定義", "category": "完全なる畳み込み・定義", "tip": "セグメンテーションのため、最後の全結合層を1x1畳み込みに置き換え、すべてを畳み込み層で構成した先駆的モデルだ。", "tag": "領域分割", "full_tip": "【完全なる畳み込み・定義：FCN（Fully Convolutional Network）の基本定義】セグメンテーションのため、最後の全結合層を1x1畳み込みに置き換え、すべてを畳み込み層で構成した先駆的モデルだ。"}, {"id": 322, "term": "FCN（Fully Convolutional Network）の長所と利点", "category": "完全なる畳み込み・長所", "tip": "入力画像のサイズに一切縛られず、どんな大きさの画像でもそのまま入力して画素単位のヒートマップを一気に出力できる。", "tag": "領域分割", "full_tip": "【完全なる畳み込み・長所：FCN（Fully Convolutional Network）の長所と利点】入力画像のサイズに一切縛られず、どんな大きさの画像でもそのまま入力して画素単位のヒートマップを一気に出力できる。"}, {"id": 323, "term": "FCN（Fully Convolutional Network）の注意点と短所", "category": "完全なる畳み込み・注意", "tip": "プーリングを繰り返して縮んだ特徴マップを一気に拡大（転置畳み込み）するため、輪郭の境界がぼやけやすい。", "tag": "領域分割", "full_tip": "【完全なる畳み込み・注意：FCN（Fully Convolutional Network）の注意点と短所】プーリングを繰り返して縮んだ特徴マップを一気に拡大（転置畳み込み）するため、輪郭の境界がぼやけやすい。"}, {"id": 324, "term": "FCN（Fully Convolutional Network）の数理と背景", "category": "完全なる畳み込み・深層", "tip": "浅い層の高解像度な特徴をスキップ結合でデコーダに足し合わせることで、ボケの解消を試みた。", "tag": "領域分割", "full_tip": "【完全なる畳み込み・深層：FCN（Fully Convolutional Network）の数理と背景】浅い層の高解像度な特徴をスキップ結合でデコーダに足し合わせることで、ボケの解消を試みた。"}, {"id": 325, "term": "U-Netの基本定義", "category": "再生のU字管・定義", "tip": "エンコーダ（収縮パス）で圧縮しデコーダ（拡張パス）で拡大するU字型構造を持ち、両者をスキップ結合で繋いだ名機だ。", "tag": "領域分割", "full_tip": "【再生のU字管・定義：U-Netの基本定義】エンコーダ（収縮パス）で圧縮しデコーダ（拡張パス）で拡大するU字型構造を持ち、両者をスキップ結合で繋いだ名機だ。"}, {"id": 326, "term": "U-Netの長所と利点", "category": "再生のU字管・長所", "tip": "圧縮前の詳細な位置情報を横からデコーダにダイレクトに渡すため、輪郭の境界線が極めてシャープに復元される。", "tag": "領域分割", "full_tip": "【再生のU字管・長所：U-Netの長所と利点】圧縮前の詳細な位置情報を横からデコーダにダイレクトに渡すため、輪郭の境界線が極めてシャープに復元される。"}, {"id": 327, "term": "U-Netの注意点と短所", "category": "再生のU字管・注意", "tip": "高解像度の特徴マップをメモリに保持してデコーダに渡すため、GPUメモリの消費量が比較的大きくなる。", "tag": "領域分割", "full_tip": "【再生のU字管・注意：U-Netの注意点と短所】高解像度の特徴マップをメモリに保持してデコーダに渡すため、GPUメモリの消費量が比較的大きくなる。"}, {"id": 328, "term": "U-Netの数理と背景", "category": "再生のU字管・深層", "tip": "医療画像の細胞分割コンペで圧倒的な勝利を収め、現代では画像生成AI（Stable Diffusion）の骨格としても大活躍している。", "tag": "領域分割", "full_tip": "【再生のU字管・深層：U-Netの数理と背景】医療画像の細胞分割コンペで圧倒的な勝利を収め、現代では画像生成AI（Stable Diffusion）の骨格としても大活躍している。"}, {"id": 329, "term": "Vision Transformer（ViT）の基本定義", "category": "破砕の眼光・定義", "tip": "画像を16x16ピクセルなどの正方形パッチに切り刻み、単語トークンのように見立ててTransformerに流し込むモデルだ。", "tag": "最新画像AI", "full_tip": "【破砕の眼光・定義：Vision Transformer（ViT）の基本定義】画像を16x16ピクセルなどの正方形パッチに切り刻み、単語トークンのように見立ててTransformerに流し込むモデルだ。"}, {"id": 330, "term": "Vision Transformer（ViT）の長所と利点", "category": "破砕の眼光・長所", "tip": "CNNの『近くのピクセル同士しか見ない』という帰納バイアスから解放され、超巨大データでCNNの精度を圧倒する。", "tag": "最新画像AI", "full_tip": "【破砕の眼光・長所：Vision Transformer（ViT）の長所と利点】CNNの『近くのピクセル同士しか見ない』という帰納バイアスから解放され、超巨大データでCNNの精度を圧倒する。"}, {"id": 331, "term": "Vision Transformer（ViT）の注意点と短所", "category": "破砕の眼光・注意", "tip": "データ量が少ない環境ではCNNよりも学習が難しく、画像パッチの分割により微小な境界線の認識が荒くなることがある。", "tag": "最新画像AI", "full_tip": "【破砕の眼光・注意：Vision Transformer（ViT）の注意点と短所】データ量が少ない環境ではCNNよりも学習が難しく、画像パッチの分割により微小な境界線の認識が荒くなることがある。"}, {"id": 332, "term": "Vision Transformer（ViT）の数理と背景", "category": "破砕の眼光・深層", "tip": "パッチ列の先頭に『[CLS]トークン』を添え、最終層でこのトークンの出力を取り出して画像全体の分類を行う。", "tag": "最新画像AI", "full_tip": "【破砕の眼光・深層：Vision Transformer（ViT）の数理と背景】パッチ列の先頭に『[CLS]トークン』を添え、最終層でこのトークンの出力を取り出して画像全体の分類を行う。"}, {"id": 333, "term": "形態素解析の基本定義", "category": "言葉の解体・定義", "tip": "文章を意味を持つ最小の言語単位（形態素）にバラバラに分解し、それぞれの品詞を特定する言語処理の第一歩だ。", "tag": "自然言語処理", "full_tip": "【言葉の解体・定義：形態素解析の基本定義】文章を意味を持つ最小の言語単位（形態素）にバラバラに分解し、それぞれの品詞を特定する言語処理の第一歩だ。"}, {"id": 334, "term": "形態素解析の長所と利点", "category": "言葉の解体・長所", "tip": "日本語のように単語の間にスペースがない言語において、テキストをコンピュータが処理できる単語列へと整形できる。", "tag": "自然言語処理", "full_tip": "【言葉の解体・長所：形態素解析の長所と利点】日本語のように単語の間にスペースがない言語において、テキストをコンピュータが処理できる単語列へと整形できる。"}, {"id": 335, "term": "形態素解析の注意点と短所", "category": "言葉の解体・注意", "tip": "新語、流行語、専門用語、砕けた俗語（スラング）が辞書に登録されていないと、不自然な位置で誤分割してしまう。", "tag": "自然言語処理", "full_tip": "【言葉の解体・注意：形態素解析の注意点と短所】新語、流行語、専門用語、砕けた俗語（スラング）が辞書に登録されていないと、不自然な位置で誤分割してしまう。"}, {"id": 336, "term": "形態素解析の数理と背景", "category": "言葉の解体・深層", "tip": "MeCab、Janome、Sudachiなどの名ツールがあり、背後では隠れマルコフモデル（HMM）やCRFが動いている。", "tag": "自然言語処理", "full_tip": "【言葉の解体・深層：形態素解析の数理と背景】MeCab、Janome、Sudachiなどの名ツールがあり、背後では隠れマルコフモデル（HMM）やCRFが動いている。"}, {"id": 337, "term": "Bag-of-Words（BoW）の基本定義", "category": "単語の麻袋・定義", "tip": "文章の中に出てくる単語の『語順』は完全に無視し、単語ごとの『出現回数』だけを数えてベクトル化する素朴な手法だ。", "tag": "自然言語処理", "full_tip": "【単語の麻袋・定義：Bag-of-Words（BoW）の基本定義】文章の中に出てくる単語の『語順』は完全に無視し、単語ごとの『出現回数』だけを数えてベクトル化する素朴な手法だ。"}, {"id": 338, "term": "Bag-of-Words（BoW）の長所と利点", "category": "単語の麻袋・長所", "tip": "アルゴリズムが極めて単純で計算が速く、単語の頻度情報だけでも大まかな文書分類やスパム判定なら十分機能する。", "tag": "自然言語処理", "full_tip": "【単語の麻袋・長所：Bag-of-Words（BoW）の長所と利点】アルゴリズムが極めて単純で計算が速く、単語の頻度情報だけでも大まかな文書分類やスパム判定なら十分機能する。"}, {"id": 339, "term": "Bag-of-Words（BoW）の注意点と短所", "category": "単語の麻袋・注意", "tip": "語順が完全に消えるため、『私が彼を倒した』と『彼が私を倒した』が全く同じベクトルになってしまう致命的弱点がある。", "tag": "自然言語処理", "full_tip": "【単語の麻袋・注意：Bag-of-Words（BoW）の注意点と短所】語順が完全に消えるため、『私が彼を倒した』と『彼が私を倒した』が全く同じベクトルになってしまう致命的弱点がある。"}, {"id": 340, "term": "Bag-of-Words（BoW）の数理と背景", "category": "単語の麻袋・深層", "tip": "辞書にある全単語数の次元を持つ巨大でスカスカなベクトル（高次元スパースベクトル）になる。", "tag": "自然言語処理", "full_tip": "【単語の麻袋・深層：Bag-of-Words（BoW）の数理と背景】辞書にある全単語数の次元を持つ巨大でスカスカなベクトル（高次元スパースベクトル）になる。"}, {"id": 341, "term": "TF-IDFの基本定義", "category": "真価の選別・定義", "tip": "その文章でよく出る単語（TF）を評価しつつ、どの文章にも当たり前に出るありふれた単語（IDF）の価値を下げる指標だ。", "tag": "自然言語処理", "full_tip": "【真価の選別・定義：TF-IDFの基本定義】その文章でよく出る単語（TF）を評価しつつ、どの文章にも当たり前に出るありふれた単語（IDF）の価値を下げる指標だ。"}, {"id": 342, "term": "TF-IDFの長所と利点", "category": "真価の選別・長所", "tip": "『です・ます』のような無意味な頻出語に惑わされず、その文書を特徴づける真に重要なキーワードをあぶり出せる。", "tag": "自然言語処理", "full_tip": "【真価の選別・長所：TF-IDFの長所と利点】『です・ます』のような無意味な頻出語に惑わされず、その文書を特徴づける真に重要なキーワードをあぶり出せる。"}, {"id": 343, "term": "TF-IDFの注意点と短所", "category": "真価の選別・注意", "tip": "単語の意味的な類似性（『犬』と『小型犬』が近いことなど）や文脈、語順は一切考慮されない。", "tag": "自然言語処理", "full_tip": "【真価の選別・注意：TF-IDFの注意点と短所】単語の意味的な類似性（『犬』と『小型犬』が近いことなど）や文脈、語順は一切考慮されない。"}, {"id": 344, "term": "TF-IDFの数理と背景", "category": "真価の選別・深層", "tip": "文書検索エンジンのランキングスコアや、テキスト分類の入力特徴量として長年君臨している。", "tag": "自然言語処理", "full_tip": "【真価の選別・深層：TF-IDFの数理と背景】文書検索エンジンのランキングスコアや、テキスト分類の入力特徴量として長年君臨している。"}, {"id": 345, "term": "Word2Vecの基本定義", "category": "言霊の結晶・定義", "tip": "大量の文章データを読み込み、単語の意味を数百次元の実数ベクトル空間に配置（分散表現）する2013年の大発明だ。", "tag": "自然言語処理", "full_tip": "【言霊の結晶・定義：Word2Vecの基本定義】大量の文章データを読み込み、単語の意味を数百次元の実数ベクトル空間に配置（分散表現）する2013年の大発明だ。"}, {"id": 346, "term": "Word2Vecの長所と利点", "category": "言霊の結晶・長所", "tip": "『王様 - 男 + 女 = 女王』のように単語同士の意味の足し算・引き算が可能になり、類似語の検索も瞬時に行える。", "tag": "自然言語処理", "full_tip": "【言霊の結晶・長所：Word2Vecの長所と利点】『王様 - 男 + 女 = 女王』のように単語同士の意味の足し算・引き算が可能になり、類似語の検索も瞬時に行える。"}, {"id": 347, "term": "Word2Vecの注意点と短所", "category": "言霊の結晶・注意", "tip": "同じ綴りでも文脈によって意味が異なる『同音異義語（多義語：バンクが銀行か土手か）』を1つのベクトルに混ぜてしまう。", "tag": "自然言語処理", "full_tip": "【言霊の結晶・注意：Word2Vecの注意点と短所】同じ綴りでも文脈によって意味が異なる『同音異義語（多義語：バンクが銀行か土手か）』を1つのベクトルに混ぜてしまう。"}, {"id": 348, "term": "Word2Vecの数理と背景", "category": "言霊の結晶・深層", "tip": "文脈から中心単語を当てる『CBOW』と、中心単語から周囲を当てる『Skip-gram』の2つの修行法がある。", "tag": "自然言語処理", "full_tip": "【言霊の結晶・深層：Word2Vecの数理と背景】文脈から中心単語を当てる『CBOW』と、中心単語から周囲を当てる『Skip-gram』の2つの修行法がある。"}, {"id": 349, "term": "FastTextの基本定義", "category": "細片の結束・定義", "tip": "単語を丸ごと1つとして扱うのではなく、文字単位のN-gram（サブワード）の集まりとして表現する進化型Word2Vecだ。", "tag": "自然言語処理", "full_tip": "【細片の結束・定義：FastTextの基本定義】単語を丸ごと1つとして扱うのではなく、文字単位のN-gram（サブワード）の集まりとして表現する進化型Word2Vecだ。"}, {"id": 350, "term": "FastTextの長所と利点", "category": "細片の結束・長所", "tip": "辞書に載っていない未知語（新語）や入力のスペルミスに対しても、構成パーツから意味を推測してベクトルを生成できる。", "tag": "自然言語処理", "full_tip": "【細片の結束・長所：FastTextの長所と利点】辞書に載っていない未知語（新語）や入力のスペルミスに対しても、構成パーツから意味を推測してベクトルを生成できる。"}, {"id": 351, "term": "FastTextの注意点と短所", "category": "細片の結束・注意", "tip": "考慮するサブワードの数が膨大になるため、学習時のメモリ消費と辞書ファイルの容量が跳ね上がる。", "tag": "自然言語処理", "full_tip": "【細片の結束・注意：FastTextの注意点と短所】考慮するサブワードの数が膨大になるため、学習時のメモリ消費と辞書ファイルの容量が跳ね上がる。"}, {"id": 352, "term": "FastTextの数理と背景", "category": "細片の結束・深層", "tip": "Facebook（Meta）が開発し、テキスト分類の超高速エンジンとしても世界中で広く活用されている。", "tag": "自然言語処理", "full_tip": "【細片の結束・深層：FastTextの数理と背景】Facebook（Meta）が開発し、テキスト分類の超高速エンジンとしても世界中で広く活用されている。"}, {"id": 353, "term": "RNN（リカレントニューラルネット）の基本定義", "category": "巡る記憶の輪・定義", "tip": "過去の自分の隠れ状態を、次の時刻の入力と一緒に受け取るループ構造を持つ、時系列・文章処理の元祖モデルだ。", "tag": "系列モデル", "full_tip": "【巡る記憶の輪・定義：RNN（リカレントニューラルネット）の基本定義】過去の自分の隠れ状態を、次の時刻の入力と一緒に受け取るループ構造を持つ、時系列・文章処理の元祖モデルだ。"}, {"id": 354, "term": "RNN（リカレントニューラルネット）の長所と利点", "category": "巡る記憶の輪・長所", "tip": "文章の長さや時系列のステップ数が可変であっても柔軟に処理でき、過去の文脈を記憶しながら次の行動を決められる。", "tag": "系列モデル", "full_tip": "【巡る記憶の輪・長所：RNN（リカレントニューラルネット）の長所と利点】文章の長さや時系列のステップ数が可変であっても柔軟に処理でき、過去の文脈を記憶しながら次の行動を決められる。"}, {"id": 355, "term": "RNN（リカレントニューラルネット）の注意点と短所", "category": "巡る記憶の輪・注意", "tip": "系列が数十ステップ以上に長くなると、逆伝播の過程で勾配消失・爆発が起き、長期の記憶を完全に忘却してしまう。", "tag": "系列モデル", "full_tip": "【巡る記憶の輪・注意：RNN（リカレントニューラルネット）の注意点と短所】系列が数十ステップ以上に長くなると、逆伝播の過程で勾配消失・爆発が起き、長期の記憶を完全に忘却してしまう。"}, {"id": 356, "term": "RNN（リカレントニューラルネット）の数理と背景", "category": "巡る記憶の輪・深層", "tip": "時間を過去へ遡りながら誤差を逆流させる『BPTT（Backpropagation Through Time）』という修練法で学習する。", "tag": "系列モデル", "full_tip": "【巡る記憶の輪・深層：RNN（リカレントニューラルネット）の数理と背景】時間を過去へ遡りながら誤差を逆流させる『BPTT（Backpropagation Through Time）』という修練法で学習する。"}, {"id": 357, "term": "BPTT（時間の逆伝播）の基本定義", "category": "時を駆ける逆流・定義", "tip": "RNNのループ構造を時間軸方向にパタパタと展開（アンロール）し、過去へ過去へと誤差を逆伝播させる学習アルゴリズムだ。", "tag": "系列モデル", "full_tip": "【時を駆ける逆流・定義：BPTT（時間の逆伝播）の基本定義】RNNのループ構造を時間軸方向にパタパタと展開（アンロール）し、過去へ過去へと誤差を逆伝播させる学習アルゴリズムだ。"}, {"id": 358, "term": "BPTT（時間の逆伝播）の長所と利点", "category": "時を駆ける逆流・長所", "tip": "通常の誤差逆伝播法の枠組みをそのまま時系列データに適用でき、時間的な因果関係をネットワークに学習させられる。", "tag": "系列モデル", "full_tip": "【時を駆ける逆流・長所：BPTT（時間の逆伝播）の長所と利点】通常の誤差逆伝播法の枠組みをそのまま時系列データに適用でき、時間的な因果関係をネットワークに学習させられる。"}, {"id": 359, "term": "BPTT（時間の逆伝播）の注意点と短所", "category": "時を駆ける逆流・注意", "tip": "時系列が長すぎると、重み行列の連続積によって勾配が瞬時にゼロへ霧散するか、無限大へ爆発する宿命を背負う。", "tag": "系列モデル", "full_tip": "【時を駆ける逆流・注意：BPTT（時間の逆伝播）の注意点と短所】時系列が長すぎると、重み行列の連続積によって勾配が瞬時にゼロへ霧散するか、無限大へ爆発する宿命を背負う。"}, {"id": 360, "term": "BPTT（時間の逆伝播）の数理と背景", "category": "時を駆ける逆流・深層", "tip": "実務では一定のステップ数（例：30ステップ）で逆伝播を強制的に打ち切る『Truncated BPTT』で妥協する。", "tag": "系列モデル", "full_tip": "【時を駆ける逆流・深層：BPTT（時間の逆伝播）の数理と背景】実務では一定のステップ数（例：30ステップ）で逆伝播を強制的に打ち切る『Truncated BPTT』で妥協する。"}, {"id": 361, "term": "LSTMの基本定義", "category": "不滅の長期記憶・定義", "tip": "RNNの内部に情報をそのまま通す『セル状態』と、忘却・入力・出力の3つのゲート機構を備えた長期記憶の守護者だ。", "tag": "系列モデル", "full_tip": "【不滅の長期記憶・定義：LSTMの基本定義】RNNの内部に情報をそのまま通す『セル状態』と、忘却・入力・出力の3つのゲート機構を備えた長期記憶の守護者だ。"}, {"id": 362, "term": "LSTMの長所と利点", "category": "不滅の長期記憶・長所", "tip": "従来のRNNで数ステップしか持たなかった記憶を、数百ステップ先まで鮮明に保持して時系列を処理できる。", "tag": "系列モデル", "full_tip": "【不滅の長期記憶・長所：LSTMの長所と利点】従来のRNNで数ステップしか持たなかった記憶を、数百ステップ先まで鮮明に保持して時系列を処理できる。"}, {"id": 363, "term": "LSTMの注意点と短所", "category": "不滅の長期記憶・注意", "tip": "構造が複雑でパラメータ数が多く、内部の計算を時間軸方向に1ステップずつ逐次処理せねばならず学習が遅い。", "tag": "系列モデル", "full_tip": "【不滅の長期記憶・注意：LSTMの注意点と短所】構造が複雑でパラメータ数が多く、内部の計算を時間軸方向に1ステップずつ逐次処理せねばならず学習が遅い。"}, {"id": 364, "term": "LSTMの数理と背景", "category": "不滅の長期記憶・深層", "tip": "セル状態の中心にある『CEC（Constant Error Carousel）』が、勾配を減衰させずに永久循環させる鍵である。", "tag": "系列モデル", "full_tip": "【不滅の長期記憶・深層：LSTMの数理と背景】セル状態の中心にある『CEC（Constant Error Carousel）』が、勾配を減衰させずに永久循環させる鍵である。"}, {"id": 365, "term": "GRU（Gated Recurrent Unit）の基本定義", "category": "無駄なき軽装・定義", "tip": "LSTMの強力な長期記憶を保ちつつ、セル状態を統合し『更新ゲート』と『リセットゲート』の2つだけに削ぎ落とした軽量戦士だ。", "tag": "系列モデル", "full_tip": "【無駄なき軽装・定義：GRU（Gated Recurrent Unit）の基本定義】LSTMの強力な長期記憶を保ちつつ、セル状態を統合し『更新ゲート』と『リセットゲート』の2つだけに削ぎ落とした軽量戦士だ。"}, {"id": 366, "term": "GRU（Gated Recurrent Unit）の長所と利点", "category": "無駄なき軽装・長所", "tip": "LSTMと同等の予測精度を維持しながら、パラメータ数が約25%少なく計算が高速で、過学習もしにくい。", "tag": "系列モデル", "full_tip": "【無駄なき軽装・長所：GRU（Gated Recurrent Unit）の長所と利点】LSTMと同等の予測精度を維持しながら、パラメータ数が約25%少なく計算が高速で、過学習もしにくい。"}, {"id": 367, "term": "GRU（Gated Recurrent Unit）の注意点と短所", "category": "無駄なき軽装・注意", "tip": "極めて長い複雑な依存関係の保持においては、依然として3ゲートを持つフルスペックのLSTMの方が勝ることがある。", "tag": "系列モデル", "full_tip": "【無駄なき軽装・注意：GRU（Gated Recurrent Unit）の注意点と短所】極めて長い複雑な依存関係の保持においては、依然として3ゲートを持つフルスペックのLSTMの方が勝ることがある。"}, {"id": 368, "term": "GRU（Gated Recurrent Unit）の数理と背景", "category": "無駄なき軽装・深層", "tip": "チョ・キョンヒョン（Kyunghyun Cho）らが2014年のSeq2Seq研究の中で考案した。", "tag": "系列モデル", "full_tip": "【無駄なき軽装・深層：GRU（Gated Recurrent Unit）の数理と背景】チョ・キョンヒョン（Kyunghyun Cho）らが2014年のSeq2Seq研究の中で考案した。"}, {"id": 369, "term": "Seq2Seqの基本定義", "category": "異国の通訳・定義", "tip": "入力文をエンコーダで1本の固定長ベクトルにギュッと要約し、それをデコーダで別言語の文章へと展開する翻訳モデルだ。", "tag": "系列モデル", "full_tip": "【異国の通訳・定義：Seq2Seqの基本定義】入力文をエンコーダで1本の固定長ベクトルにギュッと要約し、それをデコーダで別言語の文章へと展開する翻訳モデルだ。"}, {"id": 370, "term": "Seq2Seqの長所と利点", "category": "異国の通訳・長所", "tip": "『入力の長さ』と『出力の長さ』が異なるタスク（機械翻訳、文章要約、対話応答など）を初めて統一的に解けるようにした。", "tag": "系列モデル", "full_tip": "【異国の通訳・長所：Seq2Seqの長所と利点】『入力の長さ』と『出力の長さ』が異なるタスク（機械翻訳、文章要約、対話応答など）を初めて統一的に解けるようにした。"}, {"id": 371, "term": "Seq2Seqの注意点と短所", "category": "異国の通訳・注意", "tip": "どんなに長い文章であっても、最後のたった1本のベクトルに情報を押し込めねばならず、長文で情報が溢れて破綻する。", "tag": "系列モデル", "full_tip": "【異国の通訳・注意：Seq2Seqの注意点と短所】どんなに長い文章であっても、最後のたった1本のベクトルに情報を押し込めねばならず、長文で情報が溢れて破綻する。"}, {"id": 372, "term": "Seq2Seqの数理と背景", "category": "異国の通訳・深層", "tip": "この情報ボトルの首（ボトルネック）を打ち破るために生み出されたのが、後の世界を変える『Attention機構』だ。", "tag": "系列モデル", "full_tip": "【異国の通訳・深層：Seq2Seqの数理と背景】この情報ボトルの首（ボトルネック）を打ち破るために生み出されたのが、後の世界を変える『Attention機構』だ。"}, {"id": 373, "term": "Attention（注意機構）の基本定義", "category": "焦眉の凝視・定義", "tip": "入力文を1本の固定ベクトルに詰め込むのをやめ、出力単語を生成するたびに入力文の『どこを見るべきか』を動的参照する技だ。", "tag": "注意機構", "full_tip": "【焦眉の凝視・定義：Attention（注意機構）の基本定義】入力文を1本の固定ベクトルに詰め込むのをやめ、出力単語を生成するたびに入力文の『どこを見るべきか』を動的参照する技だ。"}, {"id": 374, "term": "Attention（注意機構）の長所と利点", "category": "焦眉の凝視・長所", "tip": "長文になっても翻訳精度が全く落ちなくなり、モデルが入力文のどの単語に注目して訳したかを可視化できるようになった。", "tag": "注意機構", "full_tip": "【焦眉の凝視・長所：Attention（注意機構）の長所と利点】長文になっても翻訳精度が全く落ちなくなり、モデルが入力文のどの単語に注目して訳したかを可視化できるようになった。"}, {"id": 375, "term": "Attention（注意機構）の注意点と短所", "category": "焦眉の凝視・注意", "tip": "各ステップで入力文の全単語に対して総当たりで関連度を計算するため、計算量が文章の長さの2乗で増大する。", "tag": "注意機構", "full_tip": "【焦眉の凝視・注意：Attention（注意機構）の注意点と短所】各ステップで入力文の全単語に対して総当たりで関連度を計算するため、計算量が文章の長さの2乗で増大する。"}, {"id": 376, "term": "Attention（注意機構）の数理と背景", "category": "焦眉の凝視・深層", "tip": "バダナウらの加法的注意（Bahdanau Attention）や、ルオンらの乗法的注意（Luong Attention）から歴史が始まった。", "tag": "注意機構", "full_tip": "【焦眉の凝視・深層：Attention（注意機構）の数理と背景】バダナウらの加法的注意（Bahdanau Attention）や、ルオンらの乗法的注意（Luong Attention）から歴史が始まった。"}, {"id": 377, "term": "Transformerの基本定義", "category": "神殿の再建・定義", "tip": "2017年の論文『Attention Is All You Need』で誕生。再帰（RNN）を完全に排除し、Self-Attentionだけで構成された新時代の基盤だ。", "tag": "言語モデル", "full_tip": "【神殿の再建・定義：Transformerの基本定義】2017年の論文『Attention Is All You Need』で誕生。再帰（RNN）を完全に排除し、Self-Attentionだけで構成された新時代の基盤だ。"}, {"id": 378, "term": "Transformerの長所と利点", "category": "神殿の再建・長所", "tip": "系列全体を一度に並列処理できるためGPUの計算能力を極限まで引き出せ、極めて長距離の依存関係も一瞬で捉える。", "tag": "言語モデル", "full_tip": "【神殿の再建・長所：Transformerの長所と利点】系列全体を一度に並列処理できるためGPUの計算能力を極限まで引き出せ、極めて長距離の依存関係も一瞬で捉える。"}, {"id": 379, "term": "Transformerの注意点と短所", "category": "神殿の再建・注意", "tip": "入力文章の長さ（トークン数 $N$）に対して、Self-Attentionの計算量とメモリ消費が2乗（$O(N^2)$）で増大する弱点がある。", "tag": "言語モデル", "full_tip": "【神殿の再建・注意：Transformerの注意点と短所】入力文章の長さ（トークン数 $N$）に対して、Self-Attentionの計算量とメモリ消費が2乗（$O(N^2)$）で増大する弱点がある。"}, {"id": 380, "term": "Transformerの数理と背景", "category": "神殿の再建・深層", "tip": "検索のQuery、見出しのKey、中身のValueの内積で注意の重みを計算し、位置情報をPositional Encodingで補う。", "tag": "言語モデル", "full_tip": "【神殿の再建・深層：Transformerの数理と背景】検索のQuery、見出しのKey、中身のValueの内積で注意の重みを計算し、位置情報をPositional Encodingで補う。"}, {"id": 381, "term": "Self-Attention（自己注意機構）の基本定義", "category": "言霊の交差・定義", "tip": "文の中にある単語同士が、お互いにどれくらい強く関連し合っているかを総当たりで計算するTransformerの中核エンジンだ。", "tag": "Transformer", "full_tip": "【言霊の交差・定義：Self-Attention（自己注意機構）の基本定義】文の中にある単語同士が、お互いにどれくらい強く関連し合っているかを総当たりで計算するTransformerの中核エンジンだ。"}, {"id": 382, "term": "Self-Attention（自己注意機構）の長所と利点", "category": "言霊の交差・長所", "tip": "代名詞の『それ（it）』が文中のどの名詞を指しているのかといった文脈上の照応関係を鮮やかに見抜く。", "tag": "Transformer", "full_tip": "【言霊の交差・長所：Self-Attention（自己注意機構）の長所と利点】代名詞の『それ（it）』が文中のどの名詞を指しているのかといった文脈上の照応関係を鮮やかに見抜く。"}, {"id": 383, "term": "Self-Attention（自己注意機構）の注意点と短所", "category": "言霊の交差・注意", "tip": "文章の長さが10倍になると計算量が100倍に膨らむため、数万文字に及ぶ超長文の処理にはメモリ工夫が必要となる。", "tag": "Transformer", "full_tip": "【言霊の交差・注意：Self-Attention（自己注意機構）の注意点と短所】文章の長さが10倍になると計算量が100倍に膨らむため、数万文字に及ぶ超長文の処理にはメモリ工夫が必要となる。"}, {"id": 384, "term": "Self-Attention（自己注意機構）の数理と背景", "category": "言霊の交差・深層", "tip": "QueryとKeyの内積をベクトルの次元数の平方根 $\\sqrt{d_k}$ で割り算してソフトマックス関数にかける。", "tag": "Transformer", "full_tip": "【言霊の交差・深層：Self-Attention（自己注意機構）の数理と背景】QueryとKeyの内積をベクトルの次元数の平方根 $\\sqrt{d_k}$ で割り算してソフトマックス関数にかける。"}, {"id": 385, "term": "Multi-Head Attentionの基本定義", "category": "多頭の神託・定義", "tip": "Attentionの計算を複数の視点（ヘッド）に分割して並行処理し、最後に合体（Concat）させるTransformerの兵装だ。", "tag": "Transformer", "full_tip": "【多頭の神託・定義：Multi-Head Attentionの基本定義】Attentionの計算を複数の視点（ヘッド）に分割して並行処理し、最後に合体（Concat）させるTransformerの兵装だ。"}, {"id": 386, "term": "Multi-Head Attentionの長所と利点", "category": "多頭の神託・長所", "tip": "文法的な係り受けを見るヘッド、意味的な同義関係を見るヘッドなど、異なる種類の関係性を同時に抽出できる。", "tag": "Transformer", "full_tip": "【多頭の神託・長所：Multi-Head Attentionの長所と利点】文法的な係り受けを見るヘッド、意味的な同義関係を見るヘッドなど、異なる種類の関係性を同時に抽出できる。"}, {"id": 387, "term": "Multi-Head Attentionの注意点と短所", "category": "多頭の神託・注意", "tip": "ヘッド数を増やしすぎると1つのヘッドあたりの次元数が小さくなりすぎて、個々の表現力が落ちるトレードオフがある。", "tag": "Transformer", "full_tip": "【多頭の神託・注意：Multi-Head Attentionの注意点と短所】ヘッド数を増やしすぎると1つのヘッドあたりの次元数が小さくなりすぎて、個々の表現力が落ちるトレードオフがある。"}, {"id": 388, "term": "Multi-Head Attentionの数理と背景", "category": "多頭の神託・深層", "tip": "原著論文ではヘッド数 $h=8$、全体の次元数512、各ヘッドの次元数64という黄金比が採用された。", "tag": "Transformer", "full_tip": "【多頭の神託・深層：Multi-Head Attentionの数理と背景】原著論文ではヘッド数 $h=8$、全体の次元数512、各ヘッドの次元数64という黄金比が採用された。"}, {"id": 389, "term": "Positional Encodingの基本定義", "category": "位置の道標・定義", "tip": "全単語を一気に並列処理するTransformerに対し、単語ベクトルに位置のサイン・コサイン波を足して語順を教える技法だ。", "tag": "Transformer", "full_tip": "【位置の道標・定義：Positional Encodingの基本定義】全単語を一気に並列処理するTransformerに対し、単語ベクトルに位置のサイン・コサイン波を足して語順を教える技法だ。"}, {"id": 390, "term": "Positional Encodingの長所と利点", "category": "位置の道標・長所", "tip": "RNNのように逐次処理することなく、モデルに単語の絶対的な位置や相対的な距離感を瞬時に把握させられる。", "tag": "Transformer", "full_tip": "【位置の道標・長所：Positional Encodingの長所と利点】RNNのように逐次処理することなく、モデルに単語の絶対的な位置や相対的な距離感を瞬時に把握させられる。"}, {"id": 391, "term": "Positional Encodingの注意点と短所", "category": "位置の道標・注意", "tip": "固定の三角関数波による位置情報は、事前学習時よりも遥かに長い未知の文章長への外挿がやや苦手である。", "tag": "Transformer", "full_tip": "【位置の道標・注意：Positional Encodingの注意点と短所】固定の三角関数波による位置情報は、事前学習時よりも遥かに長い未知の文章長への外挿がやや苦手である。"}, {"id": 392, "term": "Positional Encodingの数理と背景", "category": "位置の道標・深層", "tip": "現代のLLMでは、ベクトルの回転で相対位置をスマートに表す『RoPE（Rotary Position Embedding）』が主流だ。", "tag": "Transformer", "full_tip": "【位置の道標・深層：Positional Encodingの数理と背景】現代のLLMでは、ベクトルの回転で相対位置をスマートに表す『RoPE（Rotary Position Embedding）』が主流だ。"}, {"id": 393, "term": "BERTの基本定義", "category": "双面の賢者・定義", "tip": "Transformerのエンコーダを用い、文章を左から右、右から左の両方向から同時に読み込んで文脈を理解する事前学習モデルだ。", "tag": "言語モデル", "full_tip": "【双面の賢者・定義：BERTの基本定義】Transformerのエンコーダを用い、文章を左から右、右から左の両方向から同時に読み込んで文脈を理解する事前学習モデルだ。"}, {"id": 394, "term": "BERTの長所と利点", "category": "双面の賢者・長所", "tip": "文脈に応じた極めて高精度な言語理解が可能で、分類、固有表現抽出、感情分析、質問応答など幅広いタスクで頂点に立った。", "tag": "言語モデル", "full_tip": "【双面の賢者・長所：BERTの長所と利点】文脈に応じた極めて高精度な言語理解が可能で、分類、固有表現抽出、感情分析、質問応答など幅広いタスクで頂点に立った。"}, {"id": 395, "term": "BERTの注意点と短所", "category": "双面の賢者・注意", "tip": "文章全体の文脈をじっくり味わう理解型モデルであるため、チャットボットのように流暢に文章を生成していく作業は苦手だ。", "tag": "言語モデル", "full_tip": "【双面の賢者・注意：BERTの注意点と短所】文章全体の文脈をじっくり味わう理解型モデルであるため、チャットボットのように流暢に文章を生成していく作業は苦手だ。"}, {"id": 396, "term": "BERTの数理と背景", "category": "双面の賢者・深層", "tip": "文章の単語を隠して当てさせる『Masked LM』と、2つの文のつながりを判定する『Next Sentence Prediction』で事前学習する。", "tag": "言語モデル", "full_tip": "【双面の賢者・深層：BERTの数理と背景】文章の単語を隠して当てさせる『Masked LM』と、2つの文のつながりを判定する『Next Sentence Prediction』で事前学習する。"}, {"id": 397, "term": "Masked Language Model（MLM）の基本定義", "category": "仮面の穴埋め・定義", "tip": "BERTの修行法。文中の単語をランダムに約15%隠し（[MASK]にし）、周囲の文脈から元の単語を当てさせる訓練だ。", "tag": "言語モデル", "full_tip": "【仮面の穴埋め・定義：Masked Language Model（MLM）の基本定義】BERTの修行法。文中の単語をランダムに約15%隠し（[MASK]にし）、周囲の文脈から元の単語を当てさせる訓練だ。"}, {"id": 398, "term": "Masked Language Model（MLM）の長所と利点", "category": "仮面の穴埋め・長所", "tip": "前後の双方向の文脈をフル活用しなければ正解できないため、モデルに深遠で高度な言語理解力が強制的に身につく。", "tag": "言語モデル", "full_tip": "【仮面の穴埋め・長所：Masked Language Model（MLM）の長所と利点】前後の双方向の文脈をフル活用しなければ正解できないため、モデルに深遠で高度な言語理解力が強制的に身につく。"}, {"id": 399, "term": "Masked Language Model（MLM）の注意点と短所", "category": "仮面の穴埋め・注意", "tip": "ファインチューニング時には[MASK]トークンが実際の文章中に出てこないため、学習と運用の間にわずかなギャップが生じる。", "tag": "言語モデル", "full_tip": "【仮面の穴埋め・注意：Masked Language Model（MLM）の注意点と短所】ファインチューニング時には[MASK]トークンが実際の文章中に出てこないため、学習と運用の間にわずかなギャップが生じる。"}, {"id": 400, "term": "Masked Language Model（MLM）の数理と背景", "category": "仮面の穴埋め・深層", "tip": "15%のうち80%を[MASK]に、10%をランダムな別単語に、残り10%を元の単語のままにしてギャップを緩和している。", "tag": "言語モデル", "full_tip": "【仮面の穴埋め・深層：Masked Language Model（MLM）の数理と背景】15%のうち80%を[MASK]に、10%をランダムな別単語に、残り10%を元の単語のままにしてギャップを緩和している。"}, {"id": 401, "term": "GPTシリーズの基本定義", "category": "未来を紡ぐ語り部・定義", "tip": "Transformerのデコーダを用い、過去の単語列から『次に来る最も確率の高い1単語』をひたすら予測し続ける自己回帰モデルだ。", "tag": "言語モデル", "full_tip": "【未来を紡ぐ語り部・定義：GPTシリーズの基本定義】Transformerのデコーダを用い、過去の単語列から『次に来る最も確率の高い1単語』をひたすら予測し続ける自己回帰モデルだ。"}, {"id": 402, "term": "GPTシリーズの長所と利点", "category": "未来を紡ぐ語り部・長所", "tip": "驚くほど流暢で自然な文章生成、プログラミングコードの記述、論理的な対話など、汎用的な知的能力を発揮する。", "tag": "言語モデル", "full_tip": "【未来を紡ぐ語り部・長所：GPTシリーズの長所と利点】驚くほど流暢で自然な文章生成、プログラミングコードの記述、論理的な対話など、汎用的な知的能力を発揮する。"}, {"id": 403, "term": "GPTシリーズの注意点と短所", "category": "未来を紡ぐ語り部・注意", "tip": "事実無根の情報をあたかも真実のように語り出す『ハルシネーション（幻覚）』を本質的に排除できない弱点がある。", "tag": "言語モデル", "full_tip": "【未来を紡ぐ語り部・注意：GPTシリーズの注意点と短所】事実無根の情報をあたかも真実のように語り出す『ハルシネーション（幻覚）』を本質的に排除できない弱点がある。"}, {"id": 404, "term": "GPTシリーズの数理と背景", "category": "未来を紡ぐ語り部・深層", "tip": "GPT-3で1750億パラメータに達し、指示に従うInstructGPTや対話特化のChatGPT、そしてマルチモーダルなGPT-4へと進化した。", "tag": "言語モデル", "full_tip": "【未来を紡ぐ語り部・深層：GPTシリーズの数理と背景】GPT-3で1750億パラメータに達し、指示に従うInstructGPTや対話特化のChatGPT、そしてマルチモーダルなGPT-4へと進化した。"}, {"id": 405, "term": "自己回帰モデル（Autoregressive）の基本定義", "category": "連鎖の紡ぎ・定義", "tip": "自分が過去に出力した単語を次の入力として受け取り、左から右へと数珠つなぎに1単語ずつ生成していくモデルの流儀だ。", "tag": "言語モデル", "full_tip": "【連鎖の紡ぎ・定義：自己回帰モデル（Autoregressive）の基本定義】自分が過去に出力した単語を次の入力として受け取り、左から右へと数珠つなぎに1単語ずつ生成していくモデルの流儀だ。"}, {"id": 406, "term": "自己回帰モデル（Autoregressive）の長所と利点", "category": "連鎖の紡ぎ・長所", "tip": "確率の連鎖律に基づいて自然な文脈の流れを保ちながら、どこまでも続く長文のストーリーを紡ぎ出せる。", "tag": "言語モデル", "full_tip": "【連鎖の紡ぎ・長所：自己回帰モデル（Autoregressive）の長所と利点】確率の連鎖律に基づいて自然な文脈の流れを保ちながら、どこまでも続く長文のストーリーを紡ぎ出せる。"}, {"id": 407, "term": "自己回帰モデル（Autoregressive）の注意点と短所", "category": "連鎖の紡ぎ・注意", "tip": "1単語出すたびにモデルを1回順伝播させねばならず、並列に一発生成できないため文章の出力に時間がかかる。", "tag": "言語モデル", "full_tip": "【連鎖の紡ぎ・注意：自己回帰モデル（Autoregressive）の注意点と短所】1単語出すたびにモデルを1回順伝播させねばならず、並列に一発生成できないため文章の出力に時間がかかる。"}, {"id": 408, "term": "自己回帰モデル（Autoregressive）の数理と背景", "category": "連鎖の紡ぎ・深層", "tip": "生成速度を上げるため、過去のKeyとValueの計算結果をメモリに保存して再利用する『KVキャッシュ』が不可欠となる。", "tag": "言語モデル", "full_tip": "【連鎖の紡ぎ・深層：自己回帰モデル（Autoregressive）の数理と背景】生成速度を上げるため、過去のKeyとValueの計算結果をメモリに保存して再利用する『KVキャッシュ』が不可欠となる。"}, {"id": 409, "term": "スケーリング則（Scaling Laws）の基本定義", "category": "巨人の法則・定義", "tip": "モデルのパラメータ数、データセット規模、計算量を拡大すると、性能が美しいべき乗則に従って予測通り向上する法則だ。", "tag": "LLMの理", "full_tip": "【巨人の法則・定義：スケーリング則（Scaling Laws）の基本定義】モデルのパラメータ数、データセット規模、計算量を拡大すると、性能が美しいべき乗則に従って予測通り向上する法則だ。"}, {"id": 410, "term": "スケーリング則（Scaling Laws）の長所と利点", "category": "巨人の法則・長所", "tip": "巨額の資金を投じる前に、小規模な実験結果から巨大モデルを作ったときの到達精度を数理的に正確に予測できる。", "tag": "LLMの理", "full_tip": "【巨人の法則・長所：スケーリング則（Scaling Laws）の長所と利点】巨額の資金を投じる前に、小規模な実験結果から巨大モデルを作ったときの到達精度を数理的に正確に予測できる。"}, {"id": 411, "term": "スケーリング則（Scaling Laws）の注意点と短所", "category": "巨人の法則・注意", "tip": "モデルを大きくすればするほど天文学的な電気代、計算サーバー費用、二酸化炭素排出量が膨れ上がる。", "tag": "LLMの理", "full_tip": "【巨人の法則・注意：スケーリング則（Scaling Laws）の注意点と短所】モデルを大きくすればするほど天文学的な電気代、計算サーバー費用、二酸化炭素排出量が膨れ上がる。"}, {"id": 412, "term": "スケーリング則（Scaling Laws）の数理と背景", "category": "巨人の法則・深層", "tip": "カプランらが発表した初期の法則に対し、DeepMindのChinchilla研究でデータ量との最適バランス比が修正された。", "tag": "LLMの理", "full_tip": "【巨人の法則・深層：スケーリング則（Scaling Laws）の数理と背景】カプランらが発表した初期の法則に対し、DeepMindのChinchilla研究でデータ量との最適バランス比が修正された。"}, {"id": 413, "term": "創発（Emergent Abilities）の基本定義", "category": "開花する奇跡・定義", "tip": "モデルがある一定の巨大なパラメータ規模を超えた瞬間、それまで全く解けなかった難解な推論能力が突如開花する現象だ。", "tag": "LLMの理", "full_tip": "【開花する奇跡・定義：創発（Emergent Abilities）の基本定義】モデルがある一定の巨大なパラメータ規模を超えた瞬間、それまで全く解けなかった難解な推論能力が突如開花する現象だ。"}, {"id": 414, "term": "創発（Emergent Abilities）の長所と利点", "category": "開花する奇跡・長所", "tip": "多段階の論理推論、プログラミングコードのバグ修正、比喩やユーモ ダ（VAE）』だ。"}, {"id": 445, "term": "変分オートエンコーダ（VAE）の基本定義", "category": "確率の霧・定義", "tip": "潜在変数を単なる1つの固定値ではなく、平均 $\\mu$ と分散 $\\sigma$ を持つ確率分布としてモデル化した賢い自己符号化器だ。", "tag": "生成モデル", "full_tip": "【確率の霧・定義：変分オートエンコーダ（VAE）の基本定義】潜在変数を単なる1つの固定値ではなく、平均 $\\mu$ と分散 $\\sigma$ を持つ確率分布としてモデル化した賢い自己符号化器だ。"}, {"id": 446, "term": "変分オートエンコーダ（VAE）の長所と利点", "category": "確率の霧・長所", "tip": "潜在空間が正規分布に従って隙間なく滑らかに整列するため、適当な乱数をサンプリングするだけで未知の画像を生成できる。", "tag": "生成モデル", "full_tip": "【確率の霧・長所：変分オートエンコーダ（VAE）の長所と利点】潜在空間が正規分布に従って隙間なく滑らかに整列するため、適当な乱数をサンプリングするだけで未知の画像を生成できる。"}, {"id": 447, "term": "変分オートエンコーダ（VAE）の注意点と短所", "category": "確率の霧・注意", "tip": "復元画像が二乗誤差の平均化効果によって、全体的にピントがボケたような眠たい画像になりやすい欠点がある。", "tag": "生成モデル", "full_tip": "【確率の霧・注意：変分オートエンコーダ（VAE）の注意点と短所】復元画像が二乗誤差の平均化効果によって、全体的にピントがボケたような眠たい画像になりやすい欠点がある。"}, {"id": 448, "term": "変分オートエンコーダ（VAE）の数理と背景", "category": "確率の霧・深層", "tip": "乱数サンプリングがあると誤差逆伝播が通らないため、乱数を外部から足し算で注入する『再パラメータ化トリック』を使う。", "tag": "生成モデル", "full_tip": "【確率の霧・深層：変分オートエンコーダ（VAE）の数理と背景】乱数サンプリングがあると誤差逆伝播が通らないため、乱数を外部から足し算で注入する『再パラメータ化トリック』を使う。"}, {"id": 449, "term": "敵対的生成ネットワーク（GAN）の基本定義", "category": "好敵手の切磋・定義", "tip": "偽のデータを作る生成器（Generator）と、本物か偽物かを見破る識別器（Discriminator）がミニマックスゲームで競い合うモデルだ。", "tag": "生成モデル", "full_tip": "【好敵手の切磋・定義：敵対的生成ネットワーク（GAN）の基本定義】偽のデータを作る生成器（Generator）と、本物か偽物かを見破る識別器（Discriminator）がミニマックスゲームで競い合うモデルだ。"}, {"id": 450, "term": "敵対的生成ネットワーク（GAN）の長所と利点", "category": "好敵手の切磋・長所", "tip": "非常にシャープで高解像度な本物そっくりの画像や音声、ドメイン変換（昼から夜への変換など）を生成できる。", "tag": "生成モデル", "full_tip": "【好敵手の切磋・長所：敵対的生成ネットワーク（GAN）の長所と利点】非常にシャープで高解像度な本物そっくりの画像や音声、ドメイン変換（昼から夜への変換など）を生成できる。"}, {"id": 451, "term": "敵対的生成ネットワーク（GAN）の注意点と短所", "category": "好敵手の切磋・注意", "tip": "両者の実力バランスが崩れると学習が破綻しやすく、生成器が同じパターンの画像ばかり吐き出す『モード崩壊』が頻発する。", "tag": "生成モデル", "full_tip": "【好敵手の切磋・注意：敵対的生成ネットワーク（GAN）の注意点と短所】両者の実力バランスが崩れると学習が破綻しやすく、生成器が同じパターンの画像ばかり吐き出す『モード崩壊』が頻発する。"}, {"id": 452, "term": "敵対的生成ネットワーク（GAN）の数理と背景", "category": "好敵手の切磋・深層", "tip": "畳み込みを導入したDCGANや、ペアなし画像変換のCycleGAN、高品質顔生成のStyleGANなど多くの名機を生んだ。", "tag": "生成モデル", "full_tip": "【好敵手の切磋・深層：敵対的生成ネットワーク（GAN）の数理と背景】畳み込みを導入したDCGANや、ペアなし画像変換のCycleGAN、高品質顔生成のStyleGANなど多くの名機を生んだ。"}, {"id": 453, "term": "拡散モデル（Diffusion Model）の基本定義", "category": "砂嵐からの創造・定義", "tip": "画像に段階的にノイズを加えて完全なガウスノイズにし、そこから徐々にノイズを除去していく逆過程を学習する生成モデルだ。", "tag": "生成モデル", "full_tip": "【砂嵐からの創造・定義：拡散モデル（Diffusion Model）の基本定義】画像に段階的にノイズを加えて完全なガウスノイズにし、そこから徐々にノイズを除去していく逆過程を学習する生成モデルだ。"}, {"id": 454, "term": "拡散モデル（Diffusion Model）の長所と利点", "category": "砂嵐からの創造・長所", "tip": "GANのような学習の不安定さやモード崩壊がなく、極めて多様で息を呑むほど高品質な画像を安定して生成できる。", "tag": "生成モデル", "full_tip": "【砂嵐からの創造・長所：拡散モデル（Diffusion Model）の長所と利点】GANのような学習の不安定さやモード崩壊がなく、極めて多様で息を呑むほど高品質な画像を安定して生成できる。"}, {"id": 455, "term": "拡散モデル（Diffusion Model）の注意点と短所", "category": "砂嵐からの創造・注意", "tip": "ノイズ除去のステップを何十回〜何百回も繰り返す必要があるため、1枚の画像を生成するのに時間がかかる。", "tag": "生成モデル", "full_tip": "【砂嵐からの創造・注意：拡散モデル（Diffusion Model）の注意点と短所】ノイズ除去のステップを何十回〜何百回も繰り返す必要があるため、1枚の画像を生成するのに時間がかかる。"}, {"id": 456, "term": "拡散モデル（Diffusion Model）の数理と背景", "category": "砂嵐からの創造・深層", "tip": "テキスト誘導の強さを調整する『CFG』や、潜在空間でノイズ除去を行い高速化した『潜在拡散モデル（Stable Diffusion）』が有名だ。", "tag": "生成モデル", "full_tip": "【砂嵐からの創造・深層：拡散モデル（Diffusion Model）の数理と背景】テキスト誘導の強さを調整する『CFG』や、潜在空間でノイズ除去を行い高速化した『潜在拡散モデル（Stable Diffusion）』が有名だ。"}, {"id": 457, "term": "CLIPの基本定義", "category": "言霊と写し絵の絆・定義", "tip": "4億組の画像とテキストのペアを用い、画像エンコーダとテキストエンコーダの出力を対照学習で結びつけたマルチモーダルモデルだ。", "tag": "マルチモーダル", "full_tip": "【言霊と写し絵の絆・定義：CLIPの基本定義】4億組の画像とテキストのペアを用い、画像エンコーダとテキストエンコーダの出力を対照学習で結びつけたマルチモーダルモデルだ。"}, {"id": 458, "term": "CLIPの長所と利点", "category": "言霊と写し絵の絆・長所", "tip": "『画像』と『言葉』が同一のベクトル空間で結ばれ、事前学習なしで未知の画像をテキスト指示だけで分類（Zero-shot分類）できる。", "tag": "マルチモーダル", "full_tip": "【言霊と写し絵の絆・長所：CLIPの長所と利点】『画像』と『言葉』が同一のベクトル空間で結ばれ、事前学習なしで未知の画像をテキスト指示だけで分類（Zero-shot分類）できる。"}, {"id": 459, "term": "CLIPの注意点と短所", "category": "言霊と写し絵の絆・注意", "tip": "細かい位置関係や物体の個数の正確なカウントなど、複雑な空間的・論理的関係の理解はやや苦手とする。", "tag": "マルチモーダル", "full_tip": "【言霊と写し絵の絆・注意：CLIPの注意点と短所】細かい位置関係や物体の個数の正確なカウントなど、複雑な空間的・論理的関係の理解はやや苦手とする。"}, {"id": 460, だ行動とは無関係に、常に次状態の最大Q値を使って更新する『Off-Policy』アルゴリズムだ。", "tag": "強化学習", "full_tip": "【盤上の研鑽・深層：Q学習の数理と背景】自分が実際に選んだ行動とは無関係に、常に次状態の最大Q値を使って更新する『Off-Policy』アルゴリズムだ。"}, {"id": 477, "term": "Deep Q-Network（DQN）の基本定義", "category": "深層のゲーマー・定義", "tip": "盤面や画面の入力から各行動の価値（Q値）をディープニューラルネットで直接予測し、Atariのゲームで人間を超えた伝説の手法だ。", "tag": "深層強化学習", "full_tip": "【深層のゲーマー・定義：Deep Q-Network（DQN）の基本定義】盤面や画面の入力から各行動の価値（Q値）をディープニューラルネットで直接予測し、Atariのゲームで人間を超えた伝説の手法だ。"}, {"id": 478, "term": "Deep Q-Network（DQN）の長所と利点", "category": "深層のゲーマー・長所", "tip": "画像ピクセルという高次元の生データをそのまま入力として受け取り、エンドツーエンドで超人的なゲームプレイを学習できる。", "tag": "深層強化学習", "full_tip": "【深層のゲーマー・長所：Deep Q-Network（DQN）の長所と利点】画像ピクセルという高次元の生データをそのまま入力として受け取り、エンドツーエンドで超人的なゲームプレイを学習できる。"}, {"id": 479, "term": "Deep Q-Network（DQN）の注意点と短所", "category": "深層のゲーマー・注意", "tip": "Q値の過大評価が起きやすく、連続的な行動空間（ハンドルの微妙な角度調整など）の操作にはそのままでは適用できない。", "tag": "深層強化学習", "full_tip": "【深層のゲーマー・注意：Deep Q-Network（DQN）の注意点と短所】Q値の過大評価が起きやすく、連続的な行動空間（ハンドルの微妙な角度調整など）の操作にはそのままでは適用できない。"}, {"id": 480, "term": "Deep Q-Network（DQN）の数理と背景", "category": "深層のゲーマー・深層", "tip": "過去の体験を蓄えてランダムに取り出す『Experience Replay』と、目標ネットを固定する『Target Network』で学習を安定させた。", "tag": "深層強化学習", "full_tip": "【深層のゲーマー・深層：Deep Q-Network（DQN）の数理と背景】過去の体験を蓄えてランダムに取り出す『Experience Replay』と、目標ネットを固定する『Target Network』で学習を安定させた。"}, {"id": 481, "term": "方策勾配法の基本定義", "category": "直覚の鍛錬・定義", "tip": "価値関数を中継せず、累積報酬が高くなる方向へと『行動指針（方策パラメータ $\\theta$）』そのものを直接微分して賢くする手法だ。", "tag": "強化学習", "full_tip": "【直覚の鍛錬・定義：方策勾配法の基本定義】価値関数を中継せず、累積報酬が高くなる方向へと『行動指針（方策パラメータ $\\theta$）』そのものを直接微分して賢くする手法だ。"}, {"id": 482, "term": "方策勾配法の長所と利点", "category": "直覚の鍛錬・長所", "tip": "ロボットのアームの角度やアクセルの踏み込み量のような、無段階で『連続的な行動空間』を極めて滑らかに制御できる。", "tag": "強化学習", "full_tip": "【直覚の鍛錬・長所：方策勾配法の長所と利点】ロボットのアームの角度やアクセルの踏み込み量のような、無段階で『連続的な行動空間』を極めて滑らかに制御できる。"}, {"id": 483, "term": "方策勾配法の注意点と短所", "category": "直覚の鍛錬・注意", "tip": "方策の勾配の分散が非常に大きく、学習ステップごとのバラつきが激しいため、収束までに膨大な試行回数を要する。", "tag": "強化学習", "full_tip": "【直覚の鍛錬・注意：方策勾配法の注意点と短所】方策の勾配の分散が非常に大きく、学習ステップごとのバラつきが激しいため、収束まで 入観に縛られていた。", "tag": "ゲームAI", "full_tip": "【神の一手・注意：AlphaGoの注意点と短所】人間のプロ棋士が過去に打った約16万局の棋譜データを事前学習として必要とし、人間の先入観に縛られていた。"}, {"id": 492, "term": "AlphaGoの数理と背景", "category": "神の一手・深層", "tip": "後に人間の棋譜を一切見ず自己対局のみで最強になった『AlphaGo Zero』、将棋やチェスも制覇した『AlphaZero』へ進化した。", "tag": "ゲームAI", "full_tip": "【神の一手・深層：AlphaGoの数理と背景】後に人間の棋譜を一切見ず自己対局のみで最強になった『AlphaGo Zero』、将棋やチェスも制覇した『AlphaZero』へ進化した。"}, {"id": 493, "term": "PoC（概念実証: Proof of Concept）の基本定義", "category": "実験の狼煙・定義", "tip": "本格的なシステム開発の契約を結ぶ前に、手持ちの実データで本当にAIが目標精度を出せるかを小規模に実験検証するフェーズだ。", "tag": "社会実装", "full_tip": "【実験の狼煙・定義：PoC（概念実証: Proof of Concept）の基本定義】本格的なシステム開発の契約を結ぶ前に、手持ちの実データで本当にAIが目標精度を出せるかを小規模に実験検証するフェーズだ。"}, {"id": 494, "term": "PoC（概念実証: Proof of Concept）の長所と利点", "category": "実験の狼煙・長所", "tip": "多額の投資をする前にプロジェクトの実現可能性を見極められ、精度が出ない場合のプロジェクト中止判断を安全に下せる。", "tag": "社会実装", "full_tip": "【実験の狼煙・長所：PoC（概念実証: Proof of Concept）の長所と利点】多額の投資をする前にプロジェクトの実現可能性を見極められ、精度が出ない場合のプロジェクト中止判断を安全に下せる。"}, {"id": 495, "term": "PoC（概念実証: Proof of Concept）の注意点と短所", "category": "実験の狼煙・注意", "tip": "目的や成功基準（KPI）を曖昧にしたままダラダラと実験を続け、費用ばかり嵩んで本開発に進めない『PoC死』に陥りやすい。", "tag": "社会実装", "full_tip": "【実験の狼煙・注意：PoC（概念実証: Proof of Concept）の注意点と短所】目的や成功基準（KPI）を曖昧にしたままダラダラと実験を続け、費用ばかり嵩んで本開発に進めない『PoC死』に陥りやすい。"}, {"id": 496, "term": "PoC（概念実証: Proof of Concept）の数理と背景", "category": "実験の狼煙・深層", "tip": "経産省のガイドラインでは、アセスメント、PoC、本開発と小さなステップで契約を結び直す段階的アプローチが推奨される。", "tag": "社会実装", "full_tip": "【実験の狼煙・深層：PoC（概念実証: Proof of Concept）の数理と背景】経産省のガイドラインでは、アセスメント、PoC、本開発と小さなステップで契約を結び直す段階的アプローチが推奨される。"}, {"id": 497, "term": "請負契約と準委任契約の基本定義", "category": "完成と善管の掟・定義", "tip": "請負は『仕事の完成』に対して対価が支払われ、準委任は完成義務を負わず『善良な管理者の注意義務』に従った業務遂行に対価が出る。", "tag": "契約の掟", "full_tip": "【完成と善管の掟・定義：請負契約と準委任契約の基本定義】請負は『仕事の完成』に対して対価が支払われ、準委任は完成義務を負わず『善良な管理者の注意義務』に従った業務遂行に対価が出る。"}, {"id": 498, "term": "請負契約と準委任契約の長所と利点", "category": "完成と善管の掟・長所", "tip": "準委任契約であれば、事前に精度が保証できないAIのPoCフェーズでも、受託者が過大な契約不適合責任（損害賠償）を背負わずに済む。", "tag": "契約の掟", "full_tip": "【完成と善管の掟・長所：請負契約と準委任契約の長所と利点】準委任契約であれば、事前に精度が保証できないAIのPoCフェーズでも、受託者が過大な契約不適合責任（損害賠償）を背負わずに済む。"}, {"id": 499, "term": "請負契約と準委任契約の注意点と短所", "category": "完成と善管の掟・注意", "tip": "発注者からすると、準委任契約では目標精度が出なくても費用を支払わねばならず、成果の保証が得られないリスクがある。", "tag": "契約の掟", "full_tip": "【完成と善管の掟・注意：請負契約と準委任契約の注意点と短所】発注者からすると、準委任契約では目標精度が出なくても費用を支払わねばならず、成果の保証が得られないリスクがある。"}, {"id": 500, "term": "請負契約と準委任契約の数理と背景", "category": "完成と善管の掟・深層", "tip": "AI開発の初期フェーズでは準委任契約を結び、仕様と実現性が完全に確定した後の最終システム構築で請負を結ぶのが定石だ。", "tag": "契約の掟", "full_tip": "【完成と善管の掟・深層：請負契約と準委任契約の数理と背景】AI開発の初期フェーズでは準委任契約を結び、仕様と実現性が完全に確定した後の最終システム構築で請負を結ぶのが定石だ。"}, {"id": 501, "term": "著作権法 第30条の4の基本定義", "category": "解析の免状・定義", "tip": "著作物に表現された思想・感情を自ら味わったり鑑賞させたりする目的ではない『非享受利用』なら、原則無許諾で学習に使える日本の特則条文だ。", "tag": "知財と法律", "full_tip": "【解析の免状・定義：著作権法 第30条の4の基本定義】著作物に表現された思想・感情を自ら味わったり鑑賞させたりする目的ではない『非享受利用』なら、原則無許諾で学習に使える日本の特則条文だ。"}, {"id": 502, "term": "著作権法 第30条の4の長所と利点", "category": "解析の免状・長所", "tip": "世界的に見ても極めて柔軟にAIの機械学習を法的に後押ししており、日本が『機械学習パラダイス』と呼ばれる最大の法的根拠である。", "tag": "知財と法律", "full_tip": "【解析の免状・長所：著作権法 第30条の4の長所と利点】世界的に見ても極めて柔軟にAIの機械学習を法的に後押ししており、日本が『機械学習パラダイス』と呼ばれる最大の法的根拠である。"}, {"id": 503, "term": "著作権法 第30条の4の注意点と短所", "category": "解析の免状・注意", "tip": "AI生成物を鑑賞・販売する目的が混じっている場合や、学習用データセットを海賊版から複製して著作者の利益を不当に害する場合は違法となる。", "tag": "知財と法律", "full_tip": "【解析の免状・注意：著作権法 第30条の4の注意点と短所】AI生成物を鑑賞・販売する目的が混じっている場合や、学習用データセットを海賊版から複製して著作者の利益を不当に害する場合は違法となる。"}, {"id": 504, "term": "著作権法 第30条の4の数理と背景", "category": "解析の免状・深層", "tip": "平成30年（2018年）の著作権法改正で新設され、技術革新と知財保護のバランスをとる要として世界中から注目されている。", "tag": "知財と法律", "full_tip": "【解析の免状・深層：著作権法 第30条の4の数理と背景】平成30年（2018年）の著作権法改正で新設され、技術革新と知財保護のバランスをとる要として世界中から注目されている。"}, {"id": 505, "term": "著作権侵害の要件：類似性と依拠性の基本定義", "category": "二重の審判・定義", "tip": "AIが生成した画像や文章が他人の既存著作権を侵害しているかは、既存のものに似ているか（類似性）と見て作ったか（依拠性）で裁かれる。", "tag": "知財と法律", "full_tip": "【二重の審判・定義：著作権侵害の要件：類似性と依拠性の基本定義】AIが生成した画像や文章が他人の既存著作権を侵害しているかは、既存のものに似ているか（類似性）と見て作ったか（依拠性）で裁かれる。"}, {"id": 506, "term": "著作権侵害の要件：類似性と依拠性の長所と利点", "category": "二重の審判・長所", "tip": "単に作風や画風、アイデアが似ているだけでは著作権侵害にはならず、具体的な創作的表現が酷似している場合のみアウトとなる。", "tag": "知財と法律", "full_tip": "【二重の審判・長所：著作権侵害の要件：類似性と依拠性の長所と利点】単に作風や画風、アイデアが似ているだけでは著作権侵害にはならず、具体的な創作的表現が酷似している場合のみアウトとなる。"}, {"id": 507, "term": "著作権侵害の要件：類似性と依拠性の注意点と短所", "category": "二重の審判・注意", "tip": "生成モデルの学習データセットの中にその著作物が含まれていた場合、裁判で『依拠性あり』と強く推定されやすいリスクがある。", "tag": "知財と法律", "full_tip": "【二重の審判・注意：著作権侵害の要件：類似性と依拠性の注意点と短所】生成モデルの学習データセットの中にその著作物が含まれていた場合、裁判で『依拠性あり』と強く推定されやすいリスクがある。"}, {"id": 508, "term": "著作権侵害の要件：類似性と依拠性の数理と背景", "category": "二重の審判・深層", "tip": "侵害が認められた場合、著作権者から生成物の差止請求、廃棄請求、および損害賠償請求を突きつけられる。", "tag": "知財と法律", "full_tip": "【二重の審判・深層：著作権侵害の要件：類似性と依拠性の数理と背景】侵害が認められた場合、著作権者から生成物の差止請求、廃棄請求、および損害賠償請求を突きつけられる。"}, {"id": 509, "term": "個人情報保護法（要配慮個人情報）の基本定義", "category": "機微なる封印・定義", "tip": "人種、信条、社会的身分、病歴、犯罪歴など、不当な差別や偏見を生む恐れがある機微な個人情報のことだ。", "tag": "個人情報の掟", "full_tip": "【機微なる封印・定義：個人情報保護法（要配慮個人情報）の基本定義】人種、信条、社会的身分、病歴、犯罪歴など、不当な差別や偏見を生む恐れがある機微な個人情報のことだ。"}, {"id": 510, "term": "個人情報保護法（要配慮個人情報）の長所と利点", "category": "機微なる封印・長所", "tip": "本人のプライバシーを強力に保護し、AIの学習やプロファイリングによる差別的選別を未然に防止する。", "tag": "個人情報の掟", "full_tip": "【機微なる封印・長所：個人情報保護法（要配慮個人情報）の長所と利点】本人のプライバシーを強力に保護し、AIの学習やプロファイリングによる差別的選別を未然に防止する。"}, {"id": 511, "term": "個人情報保護法（要配慮個人情報）の注意点と短所", "category": "機微なる封印・注意", "tip": "取得する際は、原則として事前に本人の明確な同意が必須であり、オプトアウト（事後拒否通知）による第三者提供は絶対に許されない。", "tag": "個人情報の掟", "full_tip": "【機微なる封印・注意：個人情報保護法（要配慮個人情報）の注意点と短所】取得する際は、原則として事前に本人の明確な同意が必須であり、オプトアウト（事後拒否通知）による第三者提供は絶対に許されない。"}, {"id": 512, "term": "個人情報保護法（要配慮個人情報）の数理と背景", "category": "機微なる封印・深層", "tip": "医療AI開発などで患者データを取り扱う際は、適切な仮名加工や匿名加工、または厳格な同意取得プロセスの設計が必須となる。", "tag": "個人情報の掟", "full_tip": "【機微なる封印・深層：個人情報保護法（要配慮個人情報）の数理と背景】医療AI開発などで患者データを取り扱う際は、適切な仮名加工や匿名加工、または厳格な同意取得プロセスの設計が必須となる。"}, {"id": 513, "term": "不正競争防止法（限定提供データ）の基本定義", "category": "秘蔵の台帳・定義", "tip": "業として特定の者に提供する電磁的管理データ（ID・パスワード等で管理された有用なビッグデータ）を保護する枠組みだ。", "tag": "知財と法律", "full_tip": "【秘蔵の台帳・定義：不正競争防止法（限定提供データ）の基本定義】業として特定の者に提供する電磁的管理データ（ID・パスワード等で管理された有用なビッグデータ）を保護する枠組みだ。"}, {"id": 514, "term": "不正競争防止法（限定提供データ）の長所と利点", "category": "秘蔵の台帳・長所", "tip": "特許や著作権の対象になりにくい生データやセンサーデータ群に対しても、不正取得や無断転売に対する差止請求権が認められる。", "tag": "知財と法律", "full_tip": "【秘蔵の台帳・長所：不正競争防止法（限定提供データ）の長所と利点】特許や著作権の対象になりにくい生データやセンサーデータ群に対しても、不正取得や無断転売に対する差止請求権が認められる。"}, {"id": 515, "term": "不正競争防止法（限定提供データ）の注意点と短所", "category": "秘蔵の台帳・注意", "tip": "公然と無償公開されているオープンデータや、厳重なアクセス制限がかけられていないズサンな管理データは保護されない。", "tag": "知財と法律", "full_tip": "【秘蔵の台帳・注意：不正競争防止法（限定提供データ）の注意点と短所】公然と無償公開されているオープンデータや、厳重なアクセス制限がかけられていないズサンな管理データは保護されない。"}, {"id": 516, "term": "不正競争防止法（限定提供データ）の数理と背景", "category": "秘蔵の台帳・深層", "tip": "平成30年改正で新設され、企業間でデータを共有・連携してAI開発を行う時代のデータ取引の安全を支えている。", "tag": "知財と法律", "full_tip": "【秘蔵の台帳・深層：不正競争防止法（限定提供データ）の数理と背景】平成30年改正で新設され、企業間でデータを共有・連携してAI開発を行う時代のデータ取引の安全を支えている。"}, {"id": 517, "term": "製造物責任法（PL法）の基本定義", "category": "器の瑕疵・定義", "tip": "製造物の欠陥によって生命や身体、財産に損害を被った際、被害者が製造業者の過失を証明せずとも賠償責任を問える法律だ。", "tag": "法と責任", "full_tip": "【器の瑕疵・定義：製造物責任法（PL法）の基本定義】製造物の欠陥によって生命や身体、財産に損害を被った際、被害者が製造業者の過失を証明せずとも賠償責任を問える法律だ。"}, {"id": 518, "term": "製造物責任法（PL法）の長所と利点", "category": "器の瑕疵・長所", "tip": "欠陥製品によって被害を受けた一般消費者を、過失の立証という重いハードルから解放して手厚く救済する。", "tag": "法と責任", "full_tip": "【器の瑕疵・長所：製造物責任法（PL法）の長所と利点】欠陥製品によって被害を受けた一般消費者を、過失の立証という重いハードルから解放して手厚く救済する。"}, {"id": 519, "term": "製造物責任法（PL法）の注意点と短所", "category": "器の瑕疵・注意", "tip": "PL法が対象とする『製造物』は『製造または加工された動産（有体物）』に限られ、無形物であるソフトウェアやAIモデルは対象外だ。", "tag": "法と責任", "full_tip": "【器の瑕疵・注意：製造物責任法（PL法）の注意点と短所】PL法が対象とする『製造物』は『製造または加工された動産（有体物）』に限られ、無形物であるソフトウェアやAIモデルは対象外だ。"}, {"id": 520, "term": "製造物責任法（PL法）の数理と背景", "category": "器の瑕疵・深層", "tip": "ただし、AIを組み込んだ自動車（自動運転車）や医療ロボットなどのハードウェア製品に事故が起きれば、当然PL法の責任を負う。", "tag": "法と責任", "full_tip": "【器の瑕疵・深層：製造物責任法（PL法）の数理と背景】ただし、AIを組み込んだ自動車（自動運転車）や医療ロボットなどのハードウェア製品に事故が起きれば、当然PL法の責任を負う。"}, {"id": 521, "term": "XAI（説明可能なAI: LIMEとSHAP）の基本定義", "category": "解き明かしの光・定義", "tip": "複雑なブラックボックスAIに対し、入力データのどの特徴量が予測結果をどれだけ押し上げたかを可視化・説明する技術体系だ。", "tag": "XAIの知恵", "full_tip": "【解き明かしの光・定義：XAI（説明可能なAI: LIMEとSHAP）の基本定義】複雑なブラックボックスAIに対し、入力データのどの特徴量が予測結果をどれだけ押し上げたか d": 529, "term": "差分プライバシー（Differential Privacy）の基本定義", "category": "幻影のヴェール・定義", "tip": "集計データやAIの出力に、数学的に綿密に計算された絶妙なノイズを加えることで、個人のデータが含まれていたかを隠蔽する技術だ。", "tag": "プライバシー", "full_tip": "【幻影のヴェール・定義：差分プライバシー（Differential Privacy）の基本定義】集計データやAIの出力に、数学的に綿密に計算された絶妙なノイズを加えることで、個人のデータが含まれていたかを隠蔽する技術だ。"}, {"id": 530, "term": "差分プライバシー（Differential Privacy）の長所と利点", "category": "幻影のヴェール・長所", "tip": "どんな強力な外部補助情報を持つ攻撃者がハッキングしても、『特定の個人Aがそのデータベースに存在したか』を数学的に特定不能にできる。", "tag": "プライバシー", "full_tip": "【幻影のヴェール・長所：差分プライバシー（Differential Privacy）の長所と利点】どんな強力な外部補助情報を持つ攻撃者がハッキングしても、『特定の個人Aがそのデータベースに存在したか』を数学的に特定不能にできる。"}, {"id": 531, "term": "差分プライバシー（Differential Privacy）の注意点と短所", "category": "幻影のヴェール・注意", "tip": "プライバシー保護のノイズを強くしすぎるとデータの有用性（AIの精度）が落ちるというトレードオフが存在する。", "tag": "プライバシー", "full_tip": "【幻影のヴェール・注意：差分プライバシー（Differential Privacy）の注意点と短所】プライバシー保護のノイズを強くしすぎるとデータの有用性（AIの精度）が落ちるというトレードオフが存在する。"}, {"id": 532, "term": "差分プライバシー（Differential Privacy）の数理と背景", "category": "幻影のヴェール・深層", "tip": "保護の強固さを表すパラメータ $\\epsilon$（イプシロン）が小さいほど、プライバシーの鉄壁度が高まる。", "tag": "プライバシー", "full_tip": "【幻影のヴェール・深層：差分プライバシー（Differential Privacy）の数理と背景】保護の強固さを表すパラメータ $\\epsilon$（イプシロン）が小さいほど、プライバシーの鉄壁度が高まる。"}, {"id": 533, "term": "敵対的サンプル（Adversarial Examples）の基本定義", "category": "偽りの幻惑・定義", "tip": "人間の目には元の画像と全く見分けがつかない微小なノイズを意図的に混ぜることで、AIに99%の確信度で誤認識させる攻撃手法だ。", "tag": "セキュリティ", "full_tip": "【偽りの幻惑・定義：敵対的サンプル（Adversarial Examples）の基本定義】人間の目には元の画像と全く見分けがつかない微小なノイズを意図的に混ぜることで、AIに99%の確信度で誤認識させる攻撃手法だ。"}, {"id": 534, "term": "敵対的サンプル（Adversarial Examples）の長所と利点", "category": "偽りの幻惑・長所", "tip": "AIモデルが人間とは全く異なる脆弱な高次元決定境界で判断しているという本質的な弱点を浮き彫りにする。", "tag": "セキュリティ", "full_tip": "【偽りの幻惑・長所：敵対的サンプル（Adversarial Examples）の長所と利点】AIモデルが人間とは全く異なる脆弱な高次元決定境界で判断しているという本質的な弱点を浮き彫りにする。"}, {"id": 535, "term": "敵対的サンプル（Adversarial Examples）の注意点と短所", "category": "偽りの幻惑・注意", "tip": "道路の速度標識に小さなシールを貼るだけで、自動運転AIが『時速100キロ』と誤認して大事故を招く恐ろしいセキュリティ脅威となる。", "tag": "セキュリティ", "full_tip": "【偽りの幻惑・注意：敵対的サンプル（Adversarial Examples）の注意点と短所】道路の速度標識に小さなシールを貼るだけで、自動運転AIが『時速100キロ』と誤認して大事故を招く恐ろしいセキュリティ脅威となる。"}, {"id": 536, "term": "敵対的サンプル（Adversarial Examples）の数理と背景", "category": "偽りの幻惑・深層", "tip": "敵対的サンプルを訓練データにあらかじめ混ぜて学習させる『敵対的訓練（Adversarial Training）』などで防壁を固める。", "tag": "セキュリティ", "full_tip": "【偽りの幻惑・深層：敵対的サンプル（Adversarial Examples）の数理と背景】敵対的サンプルを訓練データにあらかじめ混ぜて学習させる『敵対的訓練（Adversarial Training）』などで防壁を固める。"}];

    let currentList = [...CARDS];
    let currentIndex = 0;
    let historyStack = [];

    // DOM要素
    const tipsCard = document.getElementById('tipsCard');
    const cardCategory = document.getElementById('cardCategory');
    const cardTag = document.getElementById('cardTag');
    const cardCounter = document.getElementById('cardCounter');
    const termNumber = document.getElementById('termNumber');
    const termText = document.getElementById('termText');
    const tipText = document.getElementById('tipText');
    const categoryFilter = document.getElementById('categoryFilter');
    const btnPrev = document.getElementById('btnPrev');
    const btnNext = document.getElementById('btnNext');
    const btnRandom = document.getElementById('btnRandom');
    const chkFlashcard = document.getElementById('chkFlashcard');
    const chkAutoRandom = document.getElementById('chkAutoRandom');

    // 初期化：カテゴリフィルターの動的生成
    function initFilters() {
      const tagSet = new Set();
      CARDS.forEach(c => tagSet.add(c.tag));
      
      tagSet.forEach(tag => {
        const opt = document.createElement('option');
        opt.value = tag;
        opt.textContent = `${tag} (${CARDS.filter(c => c.tag === tag).length}問)`;
        categoryFilter.appendChild(opt);
      });
    }

    // カード描画
    function renderCard(card, addToHistory = true) {
      if (!card) return;

      if (addToHistory && (historyStack.length === 0 || historyStack[historyStack.length - 1] !== card)) {
        historyStack.push(card);
        if (historyStack.length > 50) historyStack.shift();
      }

      cardCategory.textContent = card.category;
      cardTag.textContent = card.tag;
      cardCounter.textContent = `${String(card.id).padStart(3, '0')} / ${CARDS.length}`;
      termNumber.textContent = `#${String(card.id).padStart(3, '0')}`;
      termText.textContent = card.term;
      tipText.textContent = card.tip;

      if (chkFlashcard.checked) {
        tipText.classList.add('blur-mode');
      } else {
        tipText.classList.remove('blur-mode');
      }

      // アニメーション効果
      tipsCard.style.transform = 'scale(0.98)';
      setTimeout(() => {
        tipsCard.style.transform = 'scale(1)';
      }, 60);
    }

    // 次へ
    function nextCard() {
      if (currentList.length === 0) return;

      if (chkAutoRandom.checked) {
        randomCard();
      } else {
        currentIndex = (currentIndex + 1) % currentList.length;
        renderCard(currentList[currentIndex]);
      }
    }

    // 戻る
    function prevCard() {
      if (historyStack.length > 1) {
        historyStack.pop(); // 現在のカードを取り除く
        const prev = historyStack[historyStack.length - 1];
        currentIndex = currentList.indexOf(prev);
        if (currentIndex === -1) currentIndex = 0;
        renderCard(prev, false);
      } else if (currentList.length > 0) {
        currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
        renderCard(currentList[currentIndex]);
      }
    }

    // ランダム
    function randomCard() {
      if (currentList.length === 0) return;
      const randIdx = Math.floor(Math.random() * currentList.length);
      currentIndex = randIdx;
      renderCard(currentList[currentIndex]);
    }

    // イベントリスナー
    btnNext.addEventListener('click', nextCard);
    btnPrev.addEventListener('click', prevCard);
    btnRandom.addEventListener('click', randomCard);

    // カードエリアタップ処理（問題エリアをタップで次へ、単語帳モードはタップ2回で解答→次へ）
    tipsCard.addEventListener('click', () => {
      if (chkFlashcard.checked) {
        if (tipText.classList.contains('blur-mode')) {
          // 1回目のタップ：答えを表示
          tipText.classList.remove('blur-mode');
        } else {
          // 2回目のタップ：次へ
          nextCard();
        }
      } else {
        // 通常時：タップで次へ
        nextCard();
      }
    });

    // フィルター変更
    categoryFilter.addEventListener('change', (e) => {
      const selected = e.target.value;
      if (selected === 'ALL') {
        currentList = [...CARDS];
      } else {
        currentList = CARDS.filter(c => c.tag === selected);
      }
      currentIndex = 0;
      if (chkAutoRandom.checked) {
        randomCard();
      } else {
        renderCard(currentList[0]);
      }
    });

    // チェックボックス変更
    chkFlashcard.addEventListener('change', () => {
      if (chkFlashcard.checked) {
        tipText.classList.add('blur-mode');
      } else {
        tipText.classList.remove('blur-mode');
      }
    });

    // キーボード操作
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextCard();
      } else if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        if (chkFlashcard.checked) {
          if (tipText.classList.contains('blur-mode')) {
            tipText.classList.remove('blur-mode');
          } else {
            nextCard();
          }
        } else {
          nextCard();
        }
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevCard();
      }
    });

    // 開始
    initFilters();
    randomCard();
  </script>
</body>
</html>
